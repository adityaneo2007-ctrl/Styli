function BuyerShop({ onNav }) {
  const { state, actions, addToast } = useApp();
  const [cat, setCat] = useState('all');
  const [search, setSearch] = useState(() => {
    try { return localStorage.getItem('styli-search') || ''; } catch { return ''; }
  });
  // Clear the saved search after we pick it up so it doesn't persist forever
  useEffect(() => { try { localStorage.removeItem('styli-search'); } catch {} }, []);

  const user = state.currentUser;
  if (!user) { onNav('buyer-login'); return null; }
  if (!state.buyerProfile) { onNav('buyer-onboard'); return null; }

  const wishlist = state.buyerWishlist || [];
  const isWished = (id) => wishlist.includes(id);

  const liveProducts = state.products.filter(p => p.listed && p.approved && totalStock(p.stock) > 0);
  const categories = ['all', ...Array.from(new Set(liveProducts.map(p => p.category)))];
  const filteredByCat = cat === 'all' ? liveProducts : liveProducts.filter(p => p.category === cat);
  const q = search.trim().toLowerCase();
  const shown = q ? filteredByCat.filter(p => {
    const v = state.vendors.find(x => x.id === p.vendorId);
    return p.name.toLowerCase().includes(q)
        || p.category.toLowerCase().includes(q)
        || (p.tags || []).some(t => t.toLowerCase().includes(q))
        || (v?.name || '').toLowerCase().includes(q);
  }) : filteredByCat;

  // Mock match score — higher for products matching preferences
  const matchFor = (p) => {
    let s = 75;
    if (state.buyerProfile.style === 'boho' && p.tags.some(t => /Floral|Block|Hand-block|Boho/.test(t))) s += 18;
    if (state.buyerProfile.style === 'classic' && p.tags.some(t => /Slim|Formal|Oxford/.test(t))) s += 16;
    if (state.buyerProfile.style === 'minimal' && p.tags.some(t => /Neutral|Solid|Minimal/.test(t))) s += 16;
    if (state.buyerProfile.style === 'casual' && p.tags.some(t => /Relaxed|Cotton|Casual/.test(t))) s += 14;
    return Math.min(97, s + Math.floor(Math.random() * 6));
  };

  const withMatch = shown.map(p => ({ ...p, match: matchFor(p) })).sort((a, b) => b.match - a.match);

  return (
    <BuyerLayout active="buyer-shop" onNav={onNav}>
      <div className="buyer-page">
        <div className="buyer-hero">
          <div>
            <div className="landing-eyebrow" style={{ marginBottom: 16 }}>Hello {user.name?.split(' ')[0] || 'there'}</div>
            <h1 className="buyer-hero-headline">Your edit is <em>ready</em>.</h1>
            <p className="buyer-hero-sub">Curated from boutiques and brands across India based on your profile. Tap any piece to see why it suits you and where to buy.</p>
          </div>
          <div className="buyer-hero-visual"></div>
        </div>

        <div className="section-head">
          <div>
            <div className="section-title"><em>{shown.length}</em> {q ? `result${shown.length !== 1 ? 's' : ''} for "${q}"` : 'pieces matched for you'}</div>
            <div className="section-sub">Across {new Set(liveProducts.map(p => p.vendorId)).size} brands on Styli</div>
          </div>
        </div>

        <div style={{ marginBottom: 20 }}>
          <div className="home-nav-search" style={{ minWidth: 0, maxWidth: 480 }}>
            <span className="home-nav-search-icon">⌕</span>
            <input
              type="text"
              placeholder="Search kurtas, dresses, brands…"
              value={search}
              onChange={e => setSearch(e.target.value)}
            />
            {search && (
              <span style={{ cursor: 'pointer', color: 'var(--muted)', fontSize: 14, padding: '0 4px' }} onClick={() => setSearch('')}>✕</span>
            )}
          </div>
        </div>

        <div className="filters">
          {categories.map(c => (
            <button key={c} className={`filter-chip ${cat === c ? 'active' : ''}`} onClick={() => setCat(c)}>{c === 'all' ? 'All' : c}</button>
          ))}
        </div>

        <div className="products-grid">
          {withMatch.map(p => {
            const v = state.vendors.find(x => x.id === p.vendorId);
            const wished = isWished(p.id);
            return (
              <button key={p.id} className="product-card" onClick={() => { onNav('buyer-product', p.id); }}>
                <div className={`product-image ${p.grad}`}>
                  {p.imageUrl && <img src={p.imageUrl} alt={p.name} loading="lazy" onLoad={e => e.currentTarget.classList.add('loaded')} onError={imgFallback(p.id)} />}
                  <div className="match-badge">{p.match}% match</div>
                  <button
                    className={`wish-btn ${wished ? 'active' : ''}`}
                    onClick={(e) => {
                      e.stopPropagation();
                      actions.toggleWishlist(p.id);
                      addToast(wished ? 'Removed from wishlist' : 'Saved to wishlist', wished ? 'info' : 'success');
                    }}
                    aria-label={wished ? 'Remove from wishlist' : 'Save to wishlist'}
                  ></button>
                </div>
                <div className="product-brand">{v?.name || 'Brand'}</div>
                <div className="product-name">{p.name}</div>
                <div className="product-price">{formatINR(p.price)}</div>
              </button>
            );
          })}
        </div>
      </div>
    </BuyerLayout>
  );
}

function BuyerProduct({ onNav, productId }) {
  const { state, actions, addToast } = useApp();
  const p = state.products.find(x => x.id === productId);
  const [size, setSize] = useState(null);

  // Record this product into the buyer's recently-viewed list
  useEffect(() => { if (productId) recordRecentlyViewed(productId); }, [productId]);

  if (!p) { onNav('buyer-shop'); return null; }
  const v = state.vendors.find(x => x.id === p.vendorId);

  const addCart = () => {
    if (!size) { addToast('Pick a size first', 'warn'); return; }
    actions.addToCart({ productId: p.id, size, qty: 1, price: p.price });
    addToast(`Added to cart`, 'success');
  };

  const match = 85 + Math.floor(Math.random() * 10);
  const wished = (state.buyerWishlist || []).includes(p.id);

  return (
    <BuyerLayout active="buyer-shop" onNav={onNav}>
      <div className="buyer-page">
        <div className="breadcrumb">
          <a onClick={() => onNav('buyer-shop')}>Shop</a> / <a>{p.category}</a> / <span>{p.name}</span>
        </div>
        <div className="product-detail" style={{ padding: 0 }}>
          <div className={`detail-image-large ${p.grad}`}>
            {p.imageUrl && <img src={p.imageUrl} alt={p.name} loading="lazy" onLoad={e => e.currentTarget.classList.add('loaded')} onError={imgFallback(p.id)} />}
          </div>
          <div>
            <div className="detail-brand">{v?.name || 'Brand'}</div>
            <h1 className="detail-name">{p.name}</h1>
            <div className="detail-price">{formatINR(p.price)}</div>
            <p className="detail-desc">{p.description}</p>
            <div className="why-section">
              <div className="why-label">Why this suits you · {match}% match</div>
              <div className="why-item"><div className="why-bullet">1</div><div className="why-text">The {p.tags[0]?.toLowerCase() || 'fit'} works for your {state.buyerProfile?.fit || 'regular'} fit preference</div></div>
              <div className="why-item"><div className="why-bullet">2</div><div className="why-text">{p.tags.includes('Warm tones') || p.tags.includes('Cool tones') ? `Complements your warm undertone` : 'Color palette suits your undertone'}</div></div>
              <div className="why-item"><div className="why-bullet">3</div><div className="why-text">{v?.name} runs true to size in our tests — size {size || 'M'} fits your measurements</div></div>
            </div>
            <div className="size-section">
              <div className="size-label">Size</div>
              <div className="size-row">
                {p.sizes.map(s => {
                  const out = (p.stock[s] || 0) === 0;
                  return (
                    <button key={s} className={`size-box ${size === s ? 'selected' : ''} ${out ? 'out' : ''}`} onClick={() => !out && setSize(s)}>{s}</button>
                  );
                })}
              </div>
            </div>
            <div style={{ display: 'flex', gap: 10 }}>
              <button className="btn btn-primary" style={{ flex: 1 }} onClick={addCart}>Add to cart</button>
              <button
                className="btn btn-secondary"
                onClick={() => {
                  actions.toggleWishlist(p.id);
                  addToast(wished ? 'Removed from wishlist' : 'Saved to wishlist', wished ? 'info' : 'success');
                }}
                aria-label={wished ? 'Remove from wishlist' : 'Save to wishlist'}
              >{wished ? '♥ Saved' : '♡ Save'}</button>
              <button className="btn btn-secondary" onClick={() => onNav('buyer-shop')}>Keep browsing</button>
            </div>
          </div>
        </div>
      </div>
    </BuyerLayout>
  );
}

function BuyerCart({ onNav }) {
  const { state, actions, addToast } = useApp();
  const user = state.currentUser;

  const items = state.buyerCart.map(c => {
    const p = state.products.find(x => x.id === c.productId);
    const v = p ? state.vendors.find(x => x.id === p.vendorId) : null;
    return { ...c, product: p, vendor: v };
  }).filter(x => x.product);

  const subtotal = items.reduce((s, x) => s + x.price * x.qty, 0);
  const shipping = subtotal > 0 ? 99 : 0;
  const total = subtotal + shipping;

  const [city, setCity] = useState(user?.city || 'Delhi');
  const [pin, setPin] = useState('110001');

  const checkout = () => {
    if (items.length === 0) return;
    actions.placeOrders({ name: user.name, city, pin });
    addToast(`${items.length} order${items.length !== 1 ? 's' : ''} placed!`, 'success', '🛍');
    onNav('buyer-orders');
  };

  return (
    <BuyerLayout active="buyer-cart" onNav={onNav}>
      <div className="buyer-page" style={{ maxWidth: 1000 }}>
        <div className="breadcrumb"><a onClick={() => onNav('buyer-shop')}>Shop</a> / <span>Cart</span></div>
        <div className="section-head">
          <div><div className="section-title">Your <em>cart</em></div><div className="section-sub">{items.length} item{items.length !== 1 ? 's' : ''}</div></div>
        </div>

        {items.length === 0 ? (
          <div className="empty-state">
            <div className="empty-state-icon">◌</div>
            <div className="empty-state-text">Your cart is empty.</div>
            <button className="btn btn-primary" onClick={() => onNav('buyer-shop')}>Start shopping</button>
          </div>
        ) : (
          <div style={{ display: 'grid', gridTemplateColumns: '1.5fr 1fr', gap: 32 }}>
          <div>
            {items.map(it => (
              <div key={it.productId + it.size} className="cart-item">
                <div className={`cart-item-img ${it.product.grad}`}>
                  {it.product.imageUrl && <img src={it.product.imageUrl} alt={it.product.name} loading="lazy" onLoad={e => e.currentTarget.classList.add('loaded')} onError={imgFallback(it.product.id)} />}
                </div>
                <div className="cart-item-info">
                  <div className="cart-item-brand">{it.vendor?.name}</div>
                  <div className="cart-item-name">{it.product.name}</div>
                  <div className="cart-item-meta">Size {it.size}</div>
                  <div style={{ marginTop: 10, display: 'flex', gap: 10, alignItems: 'center' }}>
                    <div className="quantity-control">
                      <button className="qty-btn" onClick={() => actions.updateCartQty(it.productId, it.size, Math.max(1, it.qty - 1))}>−</button>
                      <input className="qty-input" value={it.qty} readOnly />
                      <button className="qty-btn" onClick={() => actions.updateCartQty(it.productId, it.size, it.qty + 1)}>+</button>
                    </div>
                    <button className="btn btn-small btn-ghost" onClick={() => actions.removeFromCart(it.productId, it.size)}>Remove</button>
                  </div>
                </div>
                <div className="cart-item-price">{formatINR(it.price * it.qty)}</div>
              </div>
            ))}
          </div>
          <div>
            <div className="cart-summary" style={{ marginBottom: 14 }}>
              <div className="cart-summary-row"><span>Subtotal</span><span>{formatINR(subtotal)}</span></div>
              <div className="cart-summary-row"><span>Shipping</span><span>{formatINR(shipping)}</span></div>
              <div className="cart-summary-row total"><span>Total</span><span>{formatINR(total)}</span></div>
            </div>
            <div className="panel" style={{ padding: 18 }}>
              <div className="panel-sub" style={{ marginBottom: 12 }}>Delivery details</div>
              <div className="field">
                <label className="field-label">City</label>
                <input className="field-input" value={city} onChange={e => setCity(e.target.value)} />
              </div>
              <div className="field">
                <label className="field-label">PIN code</label>
                <input className="field-input" value={pin} onChange={e => setPin(e.target.value)} />
              </div>
              <button className="btn btn-primary" style={{ width: '100%', marginTop: 8 }} onClick={checkout}>Place order · {formatINR(total)}</button>
              <div style={{ fontSize: 11, color: 'var(--muted)', textAlign: 'center', marginTop: 10 }}>No real payment — this is a prototype.</div>
            </div>
          </div>
        </div>
        )}
      </div>
    </BuyerLayout>
  );
}

function TeamCustomersView({ role }) {

function TeamPermissionsView({ role }) {
  const { state, actions, addToast } = useApp();
  const canEdit = can('edit.permissions', role);
  const perms = state.permissions || DEFAULT_TEAM_PERMISSIONS;

  // Group permissions by their category for a cleaner table
  const grouped = {};
  Object.entries(PERMISSION_LABELS).forEach(([action, info]) => {
    if (!grouped[info.group]) grouped[info.group] = [];
    grouped[info.group].push({ action, label: info.label });
  });
  const groupOrder = ['View', 'Operations', 'Destructive', 'Governance'];

  const ROLES = ['team-super', 'team-admin', 'team-user'];
  const ROLE_CLASS = { 'team-super': 'super', 'team-admin': 'admin', 'team-user': 'user' };

  const handleToggle = (action, r) => {
    if (!canEdit) return;
    // Safety guard — never let Superadmin lose 'edit.permissions' (would lock everyone out)
    if (action === 'edit.permissions' && r === 'team-super') {
      addToast('Cannot remove permissions editor from Superadmin', 'warn');
      return;
    }
    actions.togglePermission(action, r);
  };

  const handleReset = () => {
    if (!canEdit) return;
    if (window.confirm('Reset all permissions to defaults? This affects every team member immediately.')) {
      actions.resetPermissions();
      addToast('Permissions reset to defaults', 'success');
    }
  };

  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">Permissions</h1>
          <div className="page-sub">Edit which roles can perform each action. Changes apply instantly to every signed-in team member.</div>
        </div>
        {canEdit && <button className="btn btn-secondary" onClick={handleReset}>Reset to defaults</button>}
      </div>

      <div className="panel" style={{ padding: 0, overflow: 'hidden' }}>
        <table className="team-table" style={{ borderRadius: 0, border: 'none' }}>
          <thead>
            <tr>
              <th style={{ width: '50%' }}>Action</th>
              {ROLES.map(r => (
                <th key={r} style={{ textAlign: 'center', width: '14%' }}>
                  <span className={`role-pill ${ROLE_CLASS[r]}`}>{TEAM_ROLE_LABEL[r]}</span>
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {groupOrder.map(group => (
              <React.Fragment key={group}>
                <tr>
                  <td colSpan={4} style={{
                    background: 'var(--cream-light)',
                    fontSize: 11, color: 'var(--muted)',
                    letterSpacing: '0.12em', textTransform: 'uppercase', fontWeight: 600,
                    padding: '10px 16px',
                  }}>{group}</td>
                </tr>
                {(grouped[group] || []).map(({ action, label }) => (
                  <tr key={action}>
                    <td>
                      <strong style={{ fontSize: 13.5 }}>{label}</strong>
                      <div className="cell-sub mono" style={{ fontSize: 11, color: 'var(--muted)' }}>{action}</div>
                    </td>
                    {ROLES.map(r => {
                      const allowed = (perms[action] || []).includes(r);
                      const isLocked = action === 'edit.permissions' && r === 'team-super';
                      return (
                        <td key={r} style={{ textAlign: 'center' }}>
                          <input
                            type="checkbox"
                            checked={allowed}
                            disabled={!canEdit || isLocked}
                            onChange={() => handleToggle(action, r)}
                            style={{
                              width: 18, height: 18, cursor: canEdit && !isLocked ? 'pointer' : 'not-allowed',
                              accentColor: r === 'team-super' ? 'var(--rose-deep)' : r === 'team-admin' ? 'var(--gold-deep)' : 'var(--sage)',
                            }}
                            title={isLocked ? 'Cannot remove — would lock everyone out of editing permissions' : ''}
                          />
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </React.Fragment>
            ))}
          </tbody>
        </table>
      </div>

      <div className="panel" style={{ padding: 18, marginTop: 20, background: 'var(--cream-light)', borderColor: 'var(--gold-light)' }}>
        <div style={{ fontSize: 12.5, color: 'var(--ink-soft)', lineHeight: 1.6 }}>
          <strong>Heads up:</strong> Toggling a checkbox saves immediately — no separate Save button. The Superadmin's <em>edit permissions</em> checkbox is locked to prevent accidentally locking yourself out. To restore the original setup, use <em>Reset to defaults</em> (top right).
        </div>
      </div>
    </div>
  );
}

function VendorDashboard({ onNav }) {
  const { state } = useApp();
  const [active, setActive] = useState('dashboard');
  const user = state.currentUser;
  if (!user || user.role !== 'vendor') { onNav('vendor-login'); return null; }

  const myProducts = state.products.filter(p => p.vendorId === user.id);
  const myOrders = state.orders.filter(o => o.vendorId === user.id);
  const myReturns = state.returns.filter(r => r.vendorId === user.id);

  const badges = {
    inventory: myProducts.filter(p => isStockLow(p.stock) || isStockCritical(p.stock)).length,
    orders: myOrders.filter(o => o.status === 'to-ship').length,
    returns: myReturns.filter(r => r.status === 'pending').length,
  };

  const NAV_ITEMS = [
    { section: 'Main', items: [{ id: 'dashboard', label: 'Dashboard', icon: '◐' }] },
    { section: 'Selling', items: [
      { id: 'catalog', label: 'Catalog', icon: '▦' },
      { id: 'inventory', label: 'Inventory', icon: '▥' },
      { id: 'orders', label: 'Orders', icon: '◊' },
      { id: 'returns', label: 'Returns', icon: '↺' },
    ]},
    { section: 'Business', items: [
      { id: 'settlements', label: 'Settlements', icon: '◇' },
    ]},
  ];

  return (
    <div className="console">
      <aside className="console-sidebar">
        <div className="console-brand">
          <div className="console-brand-mark">styli<span className="dot">.</span></div>
          <div className="console-brand-sub">Seller Console</div>
        </div>
        {NAV_ITEMS.map(sec => (
          <div className="nav-section" key={sec.section}>
            <div className="nav-label">{sec.section}</div>
            {sec.items.map(item => (
              <div key={item.id} className={`nav-item ${active === item.id ? 'active' : ''}`} onClick={() => setActive(item.id)}>
                <span className="nav-icon">{item.icon}</span>
                <span>{item.label}</span>
                {badges[item.id] > 0 && <span className="nav-badge">{badges[item.id]}</span>}
              </div>
            ))}
          </div>
        ))}
        <div className="console-footer">
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <div className="user-avatar">{initials(user.name)}</div>
            <div>
              <div style={{ fontSize: 13, fontWeight: 500 }}>{user.name}</div>
              <div style={{ fontSize: 11, color: 'var(--muted)' }}>{user.type === 'small' ? 'Small seller' : 'Brand'}</div>
            </div>
          </div>
        </div>
      </aside>

      <main className="console-main">
        {active === 'dashboard' && <VendorDashView products={myProducts} orders={myOrders} returns={myReturns} user={user} />}
        {active === 'catalog' && <VendorCatalog products={myProducts} />}
        {active === 'inventory' && <VendorInventory products={myProducts} />}
        {active === 'orders' && <VendorOrders orders={myOrders} products={myProducts} />}
        {active === 'returns' && <VendorReturns returns={myReturns} products={myProducts} />}
        {active === 'settlements' && <VendorSettlements orders={myOrders} returns={myReturns} />}
      </main>
    </div>

function ProductEditor({ product, vendorId, onClose, onSave, onDelete }) {
  const isNew = !product;
  const [name, setName] = useState(product?.name || '');
  const [category, setCategory] = useState(product?.category || 'Kurtas');
  const [price, setPrice] = useState(product?.price || 0);
  const [description, setDescription] = useState(product?.description || '');
  const [grad, setGrad] = useState(product?.grad || 'grad-1');
  const [tags, setTags] = useState(product?.tags || []);
  const [sizes, setSizes] = useState(product?.sizes || ['S','M','L']);
  const [stock, setStock] = useState(product?.stock || { S: 0, M: 0, L: 0 });

  const GRADS = ['grad-1','grad-2','grad-3','grad-4','grad-5','grad-6','grad-7','grad-8','grad-9','grad-10'];
  const CATS = ['Kurtas','Dresses','Tops','Trousers','Sarees','Shirts','Co-ord Sets','Ethnic','Accessories'];
  const TAGS = ['A-line','Slim fit','Relaxed','Cotton','Linen','Silk','Casual','Formal','Festive','Block print','Hand-block','Solid','Floral','Warm tones','Cool tones','Neutral'];

  const toggleTag = (t) => setTags(prev => prev.includes(t) ? prev.filter(x => x !== t) : [...prev, t]);
  const toggleSize = (s) => {
    if (sizes.includes(s)) {
      setSizes(ss => ss.filter(x => x !== s));
      const ns = { ...stock }; delete ns[s]; setStock(ns);
    } else {
      setSizes(ss => [...ss, s]);
      setStock(st => ({ ...st, [s]: 0 }));
    }
  };
  const save = () => {
    if (!name.trim()) return;
    onSave({
      id: product?.id,
      vendorId,
      name: name.trim(),
      category, price: parseInt(price) || 0,
      description: description.trim(),
      grad, tags, sizes, stock,
      listed: product?.listed ?? true,
      approved: product?.approved ?? true,
      recommended: product?.recommended || 0,
      clicks: product?.clicks || 0,
    });
  };

  return (
    <Modal open onClose={onClose} large title={isNew ? 'Add new product' : `Edit · ${product.name}`}
      footer={<>
        {!isNew && <button className="btn btn-danger" onClick={() => { if (confirm('Delete this product?')) onDelete(product.id); }}>Delete</button>}
        <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
        <button className="btn btn-primary" disabled={!name.trim()} onClick={save}>{isNew ? 'Add product' : 'Save changes'}</button>
      </>}>
      <div className="field-row">
        <div className="field"><label className="field-label">Product name</label><input className="field-input" value={name} onChange={e => setName(e.target.value)} /></div>
        <div className="field"><label className="field-label">Category</label><select className="field-input" value={category} onChange={e => setCategory(e.target.value)}>{CATS.map(c => <option key={c}>{c}</option>)}</select></div>
      </div>
      <div className="field-row">
        <div className="field"><label className="field-label">Price (₹)</label><input className="field-input" type="number" value={price} onChange={e => setPrice(e.target.value)} /></div>
        <div className="field">
          <label className="field-label">Color preview</label>
          <div className="color-grid">{GRADS.map(g => <div key={g} className={`color-swatch ${g} ${grad === g ? 'selected' : ''}`} onClick={() => setGrad(g)}></div>)}</div>
        </div>
      </div>
      <div className="field"><label className="field-label">Description</label><textarea className="field-input" value={description} onChange={e => setDescription(e.target.value)} /></div>
      <div className="field">
        <label className="field-label">Available sizes</label>
        <div className="tag-row">{['XS','S','M','L','XL','XXL','Free'].map(s => <button key={s} className={`filter-pill ${sizes.includes(s) ? 'active' : ''}`} onClick={() => toggleSize(s)}>{s}</button>)}</div>
      </div>
      {sizes.length > 0 && (
        <div className="field">
          <label className="field-label">Stock per size</label>
          <div style={{ display: 'grid', gridTemplateColumns: `repeat(${Math.min(sizes.length, 6)}, 1fr)`, gap: 8 }}>
            {sizes.map(s => (
              <div key={s} style={{ background: 'var(--cream-light)', padding: 10, borderRadius: 8, textAlign: 'center' }}>
                <div className="text-xs muted" style={{ marginBottom: 4 }}>{s}</div>
                <input className="field-input" type="number" value={stock[s] || 0} onChange={e => setStock(st => ({ ...st, [s]: Math.max(0, parseInt(e.target.value) || 0) }))} style={{ textAlign: 'center', padding: '6px 4px' }} />
              </div>
            ))}
          </div>
        </div>
      )}
      <div className="field">
        <label className="field-label">Style tags</label>
        <div className="tag-row">{TAGS.map(t => <button key={t} className={`filter-pill ${tags.includes(t) ? 'active' : ''}`} onClick={() => toggleTag(t)}>{t}</button>)}</div>
      </div>
    </Modal>
  );
}

function VendorSettlements({ orders, returns }) {
  const gross = orders.reduce((s, o) => s + o.price * o.qty, 0);
  const comm = Math.round(gross * 0.15);
  const retAdj = returns.filter(r => r.status === 'approved').reduce((s, r) => s + r.price, 0);
  const net = gross - comm - retAdj;
  return (
    <div>
      <div className="page-header"><div><h1 className="page-title">Settlements</h1><div className="page-sub">Payouts every Friday for delivered orders past return window</div></div></div>
      <div style={{ background: 'linear-gradient(135deg, var(--ink), #2A241F)', color: 'var(--cream-light)', borderRadius: 16, padding: 28, marginBottom: 18 }}>
        <div style={{ fontSize: 12, opacity: 0.7, letterSpacing: '0.1em', textTransform: 'uppercase' }}>Estimated next payout · 24 Apr 2026</div>
        <div style={{ fontFamily: "'Fraunces', serif", fontSize: 44, fontWeight: 500, margin: '8px 0' }}>{formatINR(net)}</div>
        <div style={{ fontSize: 12, opacity: 0.7 }}>To HDFC ****4821</div>
        <div style={{ marginTop: 20, paddingTop: 20, borderTop: '1px solid rgba(245,240,232,0.15)', display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 16 }}>
          <div><div style={{ fontSize: 11, opacity: 0.65, textTransform: 'uppercase' }}>Gross</div><div style={{ fontFamily: "'Fraunces', serif", fontSize: 18, marginTop: 4 }}>{formatINR(gross)}</div></div>
          <div><div style={{ fontSize: 11, opacity: 0.65, textTransform: 'uppercase' }}>Commission 15%</div><div style={{ fontFamily: "'Fraunces', serif", fontSize: 18, marginTop: 4 }}>−{formatINR(comm)}</div></div>
          <div><div style={{ fontSize: 11, opacity: 0.65, textTransform: 'uppercase' }}>Returns</div><div style={{ fontFamily: "'Fraunces', serif", fontSize: 18, marginTop: 4 }}>−{formatINR(retAdj)}</div></div>
        </div>
      </div>
    </div>
  );
}

function AdminCustomers() {
  const { state, addToast } = useApp();
  const [search, setSearch] = useState('');

  // Build customer rollup from orders + buyers
  const customerMap = new Map();
  state.orders.forEach(o => {
    if (!customerMap.has(o.buyerId)) {
      customerMap.set(o.buyerId, { id: o.buyerId, name: o.buyer, city: o.city, orders: 0, gmv: 0, lastOrder: null });
    }
    const c = customerMap.get(o.buyerId);
    c.orders += 1;
    c.gmv += o.price * o.qty;
    if (!c.lastOrder || new Date(o.placed) > new Date(c.lastOrder)) c.lastOrder = o.placed;
  });
  // Also include registered buyers from state.buyers (may not have orders yet)
  (state.buyers || []).forEach(b => {
    if (!customerMap.has(b.id)) {
      customerMap.set(b.id, { id: b.id, name: b.name || b.email, city: b.city || '—', orders: 0, gmv: 0, lastOrder: null, email: b.email });
    } else {
      customerMap.get(b.id).email = b.email;
    }
  });

  const customers = Array.from(customerMap.values())
    .filter(c => !search || (c.name || '').toLowerCase().includes(search.toLowerCase()) || (c.email || '').toLowerCase().includes(search.toLowerCase()))
    .sort((a, b) => b.gmv - a.gmv);

  const totalGmv = customers.reduce((s, c) => s + c.gmv, 0);

  return (
    <div>
      <div className="page-header">
        <div><h1 className="page-title">Customers</h1><div className="page-sub">{customers.length} customers · {formatINR(totalGmv)} lifetime GMV</div></div>
      </div>
      <div className="filter-bar" style={{ marginBottom: 16 }}>
        <input className="search-field" placeholder="Search by name, email…" value={search} onChange={e => setSearch(e.target.value)} style={{ width: '100%' }} />
      </div>
      <div className="panel">
        <table className="table">
          <thead><tr><th>Customer</th><th>Email</th><th>City</th><th>Orders</th><th>Lifetime spend</th><th>Last order</th><th style={{textAlign:'right'}}>Actions</th></tr></thead>
          <tbody>
            {customers.map(c => (
              <tr key={c.id}>
                <td><div className="cell-primary">{c.name || '—'}</div><div className="cell-sub mono">{c.id}</div></td>
                <td>{c.email || <span style={{color:'var(--muted)'}}>—</span>}</td>
                <td>{c.city || '—'}</td>
                <td className="cell-primary">{c.orders}</td>
                <td className="cell-primary">{formatINR(c.gmv)}</td>
                <td className="cell-sub">{c.lastOrder || 'No orders'}</td>
                <td style={{textAlign:'right'}}>
                  <button className="btn btn-small btn-ghost" onClick={() => addToast(`Email: ${c.email || '—'}`, 'info')}>Contact</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {customers.length === 0 && <div className="empty-state"><div className="empty-state-icon">☺</div><div className="empty-state-text">No customers yet. They'll appear here after the first signup or order.</div></div>}
    </div>
  );
}

function AdminNewsletter() {
  const { addToast } = useApp();
  const [list, setList] = useState(() => {
    try { return JSON.parse(localStorage.getItem('styli-newsletter') || '[]'); }

  });

    try { setList(JSON.parse(localStorage.getItem('styli-newsletter') || '[]')); } catch {}

    const csv = ['email,subscribed_at', ...list.map(s => `${s.email},${new Date(s.at).toISOString()}`)].join('\n');

function AdminRoles({ onNav }) {
  const { state, actions, addToast } = useApp();
  const perms = state.permissions || DEFAULT_TEAM_PERMISSIONS;
  const grouped = {};
  Object.entries(PERMISSION_LABELS).forEach(([action, info]) => {
    if (!grouped[info.group]) grouped[info.group] = [];
    grouped[info.group].push({ action, label: info.label });
  });
  const groupOrder = ['View', 'Operations', 'Destructive', 'Governance'];
  const ROLES = ['team-super', 'team-admin', 'team-user'];
  const ROLE_CLASS = { 'team-super': 'super', 'team-admin': 'admin', 'team-user': 'user' };
  const handleToggle = (action, r) => {
    if (action === 'edit.permissions' && r === 'team-super') {
      addToast('Cannot remove permissions editor from Superadmin (would lock everyone out)', 'warn');
      return;
    }
    actions.togglePermission(action, r);
  };
  const reset = () => {
    if (window.confirm('Reset all permissions to defaults?')) {
      actions.resetPermissions();
      addToast('Permissions reset', 'success');
    }
  };

  return (
    <div>
      <div className="page-header">
        <div><h1 className="page-title">Roles &amp; permissions</h1><div className="page-sub">Toggle what each role can do — changes apply instantly to every signed-in team member</div></div>
        <button className="btn btn-secondary" onClick={reset}>Reset to defaults</button>
      </div>
      <div className="panel" style={{ padding: 0, overflow: 'hidden' }}>
        <table className="team-table" style={{ borderRadius: 0, border: 'none' }}>
          <thead>
            <tr>
              <th style={{ width: '50%' }}>Action</th>
              {ROLES.map(r => <th key={r} style={{ textAlign: 'center', width: '14%' }}><span className={`role-pill ${ROLE_CLASS[r]}`}>{TEAM_ROLE_LABEL[r]}</span></th>)}
            </tr>
          </thead>
          <tbody>
            {groupOrder.map(group => (
              <React.Fragment key={group}>
                <tr><td colSpan={4} style={{ background: 'var(--cream-light)', fontSize: 11, color: 'var(--muted)', letterSpacing: '0.12em', textTransform: 'uppercase', fontWeight: 600, padding: '10px 16px' }}>{group}</td></tr>
                {(grouped[group] || []).map(({ action, label }) => (
                  <tr key={action}>
                    <td><strong style={{ fontSize: 13.5 }}>{label}</strong><div className="cell-sub mono" style={{ fontSize: 11, color: 'var(--muted)' }}>{action}</div></td>
                    {ROLES.map(r => {
                      const allowed = (perms[action] || []).includes(r);
                      const isLocked = action === 'edit.permissions' && r === 'team-super';
                      return (
                        <td key={r} style={{ textAlign: 'center' }}>
                          <input type="checkbox" checked={allowed} disabled={isLocked} onChange={() => handleToggle(action, r)}
                            style={{ width: 18, height: 18, cursor: isLocked ? 'not-allowed' : 'pointer', accentColor: r === 'team-super' ? 'var(--rose-deep)' : r === 'team-admin' ? 'var(--gold-deep)' : 'var(--sage)' }}
                            title={isLocked ? 'Cannot remove — would lock everyone out' : ''} />
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </React.Fragment>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ============ ROUTER (URL-based) ============
// Maps route IDs to URL paths and back. Single source of truth.
const ROUTES = {
  'landing':         { path: '/' },
  'buyer-signup':    { path: '/signup' },
  'buyer-login':     { path: '/login' },
  'buyer-onboard':   { path: '/onboarding' },
  'buyer-shop':      { path: '/shop' },
  'buyer-product':   { path: '/product/:id', pattern: /^\/product\/([^/]+)$/ },
  'buyer-cart':      { path: '/cart' },
  'buyer-wishlist':  { path: '/wishlist' },
  'buyer-orders':    { path: '/orders' },
  'buyer-profile':   { path: '/profile' },
  'vendor-login':    { path: '/vendor/login' },
  'vendor-apply':    { path: '/vendor/apply' },
  'vendor-applied':  { path: '/vendor/applied' },
  'vendor-pending':  { path: '/vendor/pending' },
  'vendor-dashboard':{ path: '/vendor/dashboard' },
  'admin-login':     { path: '/admin/login' },
  'admin-dashboard': { path: '/admin' },
  'team-login':      { path: '/team/login' },
  'team-dashboard':  { path: '/team' },
};

// Convert URL path → route + param
function parseUrl(pathname) {
  // Normalise trailing slash (except root)
  const path = pathname !== '/' && pathname.endsWith('/') ? pathname.slice(0, -1) : pathname;
  // Try exact match first
  for (const [routeId, cfg] of Object.entries(ROUTES)) {
    if (cfg.path === path) return { route: routeId, param: null };
  }
  // Try pattern match (for product/:id)
  for (const [routeId, cfg] of Object.entries(ROUTES)) {
    if (cfg.pattern) {
      const m = path.match(cfg.pattern);
      if (m) return { route: routeId, param: m[1] };
    }
  }
  // Default: landing for unknown
  return { route: 'landing', param: null };
}

// Convert route + param → URL path
function buildUrl(route, param) {
  const cfg = ROUTES[route];
  if (!cfg) return '/';
  if (cfg.pattern && param) return cfg.path.replace(':id', param);
  return cfg.path;
}

function Router() {
  const { state, actions, addToast } = useApp();
  const [{ route, routeParam }, setLocation] = useState(() => {
    // Handle GitHub Pages 404 SPA redirect on first load
    const params = new URLSearchParams(window.location.search);
    const redirect = params.get('_redirect');
    if (redirect) {
      window.history.replaceState({}, '', redirect);
      const parsed = parseUrl(redirect);
      return { route: parsed.route, routeParam: parsed.param };
    }
    const parsed = parseUrl(window.location.pathname);
    return { route: parsed.route, routeParam: parsed.param };
  });

  // Listen to browser back/forward
  useEffect(() => {
    const onPopState = () => {
      const parsed = parseUrl(window.location.pathname);
      setLocation({ route: parsed.route, routeParam: parsed.param });
      window.scrollTo(0, 0);
    };
    window.addEventListener('popstate', onPopState);
    return () => window.removeEventListener('popstate', onPopState);
  }, []);

  // Navigation function — pushes URL and updates state
  const nav = (r, param) => {
    const url = buildUrl(r, param);
    if (window.location.pathname !== url) {
      window.history.pushState({}, '', url);
    }
    setLocation({ route: r, routeParam: param });
    window.scrollTo(0, 0);
  };

  const needsTopBar = !['landing','buyer-signup','buyer-login','vendor-login','vendor-apply','vendor-applied','vendor-pending','admin-login','buyer-onboard','team-login','team-dashboard'].includes(route);
  const logout = () => { actions.logout(); addToast('Logged out', 'info'); nav('landing'); };

  return (
    <div className="app-body">
      <div className="demo-banner">
        <span><strong>STYLI PLATFORM</strong> — Prototype · Data persists in browser</span>
        <button onClick={() => { if (confirm('Reset all demo data?')) { actions.resetAll(); nav('landing'); } }}>Reset demo</button>
      </div>
      {needsTopBar && <TopBar onNav={nav} currentUser={state.currentUser} onLogout={logout} />}

      {route === 'landing' && <Landing onNav={nav} />}
      {route === 'buyer-signup' && <BuyerSignup onNav={nav} />}
      {route === 'buyer-login' && <BuyerLogin onNav={nav} />}
      {route === 'buyer-onboard' && <BuyerOnboard onNav={nav} />}
      {route === 'buyer-shop' && <BuyerShop onNav={nav} />}
      {route === 'buyer-product' && <BuyerProduct onNav={nav} productId={routeParam} />}
      {route === 'buyer-cart' && <BuyerCart onNav={nav} />}
      {route === 'buyer-wishlist' && <BuyerWishlist onNav={nav} />}
      {route === 'buyer-orders' && <BuyerOrders onNav={nav} />}
      {route === 'buyer-profile' && <BuyerProfile onNav={nav} />}
      {route === 'vendor-login' && <VendorLogin onNav={nav} />}
      {route === 'vendor-apply' && <VendorApply onNav={nav} />}
      {route === 'vendor-applied' && <VendorApplied onNav={nav} />}
      {route === 'vendor-pending' && <VendorPending onNav={nav} />}
      {route === 'vendor-dashboard' && <VendorDashboard onNav={nav} />}
      {route === 'admin-login' && <AdminLogin onNav={nav} />}
      {route === 'admin-dashboard' && <AdminDashboard onNav={nav} />}
      {route === 'team-login' && <TeamLogin onNav={nav} />}
      {route === 'team-dashboard' && <TeamConsole onNav={nav} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <AppProvider><Router /></AppProvider>
);
