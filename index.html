<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Styli — Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #F5F0E8; --cream-light: #FAF6EF; --bg: #FBF8F3;
  --panel: #FFFFFF; --ink: #1A1612; --ink-soft: #3A342C; --ink-mid: #5A5249;
  --muted: #8A817A; --line: #E8E0D2; --line-soft: #F0E9DC;
  --rose: #C97B63; --rose-deep: #A85A42; --rose-light: #F3DDD2; --rose-faint: #FBF0EA;
  --sage: #7A8871; --sage-light: #E3E9DF;
  --gold: #B8935E; --gold-light: #F0E3CC; --gold-deep: #8B6F40;
  --alert: #C8553D; --alert-light: #F9E4DE;
  --ok: #5A7A52; --ok-light: #E0EAD9;
  /* Luxury accents — added for the new homepage */
  --navy: #1F2937; --navy-soft: #374151; --navy-deep: #0F172A;
  --sale: #B91C1C; --sale-light: #FEE2E2;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  font-family: 'Inter Tight', sans-serif;
  background: var(--bg); color: var(--ink);
  font-size: 14px; line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
.serif { font-family: 'Fraunces', serif; letter-spacing: -0.01em; }
.mono { font-family: 'JetBrains Mono', monospace; }

/* ======== GLOBAL TOP BAR ======== */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;
}
.topbar-brand { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 500; letter-spacing: -0.04em; cursor: pointer; }
.topbar-brand .dot { color: var(--rose); }
.topbar-right { display: flex; align-items: center; gap: 14px; }
.topbar-tag {
  font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--muted); padding: 3px 8px; border: 1px solid var(--line); border-radius: 100px;
}
.user-chip {
  display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 6px;
  background: var(--cream); border-radius: 100px; cursor: pointer; font-size: 13px;
}
.user-chip:hover { background: var(--cream-light); }
.user-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: linear-gradient(135deg, var(--rose), var(--rose-deep));
  color: white; font-weight: 600; font-size: 11px;
  display: flex; align-items: center; justify-content: center;
}
.user-avatar.admin { background: linear-gradient(135deg, var(--ink), #3A342C); }

/* ======== BUTTONS ======== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 18px; border-radius: 100px; font-size: 13px; font-weight: 500;
  border: none; cursor: pointer; transition: all 0.15s; font-family: inherit;
  letter-spacing: 0.01em;
}
.btn-primary { background: var(--ink); color: var(--cream-light); }
.btn-primary:hover { background: var(--rose-deep); }
.btn-primary:disabled { background: var(--muted); cursor: not-allowed; opacity: 0.6; }
.btn-secondary { background: var(--panel); color: var(--ink-soft); border: 1px solid var(--line); }
.btn-secondary:hover { border-color: var(--ink-soft); }
.btn-ghost { background: transparent; color: var(--ink-soft); }
.btn-ghost:hover { background: var(--cream); }
.btn-danger { background: var(--alert-light); color: var(--alert); }
.btn-danger:hover { background: var(--alert); color: white; }
.btn-small { padding: 6px 12px; font-size: 12px; border-radius: 100px; }
.btn-square { border-radius: 10px; }

/* ======== LANDING ======== */
.landing {
  min-height: 100vh;
  background:
    radial-gradient(circle at 15% 10%, rgba(232, 196, 181, 0.4) 0%, transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(184, 147, 94, 0.2) 0%, transparent 50%),
    var(--bg);
  padding: 60px 24px 80px;
}
.landing-wrap { max-width: 980px; margin: 0 auto; }
.landing-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 64px; }
.landing-brand { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 500; letter-spacing: -0.04em; }
.landing-brand .dot { color: var(--rose); }
.landing-eyebrow {
  font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--rose-deep); font-weight: 500; margin-bottom: 24px;
}
.landing-h1 {
  font-family: 'Fraunces', serif; font-size: 76px; line-height: 0.95;
  letter-spacing: -0.03em; font-weight: 400; margin-bottom: 28px;
  max-width: 760px;
}
.landing-h1 em { font-style: italic; color: var(--rose-deep); font-weight: 500; }
.landing-lead {
  font-size: 19px; color: var(--ink-soft); max-width: 580px;
  line-height: 1.5; margin-bottom: 48px;
}
.landing-choose {
  font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 18px; font-weight: 500;
}
.landing-cards {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
  margin-bottom: 64px;
}
@media (max-width: 780px) {
  .landing-cards { grid-template-columns: 1fr; }
  .landing-h1 { font-size: 52px; }
}
.landing-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
  padding: 28px 24px; cursor: pointer; transition: all 0.2s;
  display: flex; flex-direction: column; gap: 12px;
  text-align: left;
}
.landing-card:hover { transform: translateY(-3px); border-color: var(--rose); box-shadow: 0 16px 40px rgba(26, 22, 18, 0.08); }
.landing-card-icon {
  width: 48px; height: 48px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Fraunces', serif; font-size: 22px; font-weight: 500;
  margin-bottom: 8px;
}
.landing-card.buyer .landing-card-icon { background: var(--rose-faint); color: var(--rose-deep); }
.landing-card.vendor .landing-card-icon { background: var(--sage-light); color: var(--sage); }
.landing-card.admin .landing-card-icon { background: var(--cream); color: var(--ink); }
.landing-card-tag { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.landing-card-title { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 500; letter-spacing: -0.02em; }
.landing-card-desc { font-size: 13px; color: var(--ink-soft); line-height: 1.5; flex: 1; }
.landing-card-action { font-size: 13px; color: var(--rose-deep); font-weight: 500; margin-top: 8px; }
.landing-foot-note {
  padding: 18px 24px; background: var(--rose-faint); border-radius: 12px;
  font-size: 13px; color: var(--ink-soft); border-left: 3px solid var(--rose);
}

/* ======== AUTH PAGES ======== */
.auth-wrap {
  min-height: 100vh;
  background:
    radial-gradient(circle at 20% 10%, rgba(232, 196, 181, 0.3) 0%, transparent 40%),
    var(--bg);
  display: flex; align-items: center; justify-content: center; padding: 40px 24px;
}
.auth-card {
  max-width: 440px; width: 100%; background: var(--panel);
  border: 1px solid var(--line); border-radius: 24px; padding: 40px 36px;
  box-shadow: 0 20px 60px rgba(26, 22, 18, 0.06);
}
.auth-brand { font-family: 'Fraunces', serif; font-size: 24px; font-weight: 500; letter-spacing: -0.04em; margin-bottom: 28px; }
.auth-brand .dot { color: var(--rose); }
.auth-title { font-family: 'Fraunces', serif; font-size: 30px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 10px; }
.auth-title em { font-style: italic; color: var(--rose-deep); }
.auth-sub { font-size: 14px; color: var(--muted); margin-bottom: 28px; }
.auth-field { margin-bottom: 14px; }
.auth-label { display: block; font-size: 12px; color: var(--ink-mid); margin-bottom: 6px; font-weight: 500; }
.auth-input {
  width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
  font-family: inherit; font-size: 14px; background: var(--panel); outline: none;
  transition: border 0.15s;
}
.auth-input:focus { border-color: var(--rose); }
.auth-btn { width: 100%; padding: 14px; margin-top: 8px; }
.auth-footer { margin-top: 20px; font-size: 13px; color: var(--muted); text-align: center; }
.auth-footer a { color: var(--rose-deep); text-decoration: none; font-weight: 500; cursor: pointer; }
.auth-back { font-size: 12px; color: var(--muted); cursor: pointer; margin-bottom: 20px; display: inline-block; }
.auth-back:hover { color: var(--ink); }

/* ======== BUYER WEB ======== */
.buyer-page {
  max-width: 1280px; margin: 0 auto; padding: 32px 40px 80px;
}
/* Buyer console: sidebar + main content layout */
.buyer-console { display: flex; min-height: calc(100vh - 40px); background: var(--bg); }
.buyer-console .console-sidebar { background: var(--panel); }
.buyer-console .console-main { padding: 0; }
.buyer-console .buyer-page { padding: 28px 36px 80px; max-width: none; }
.buyer-console .buyer-hero { padding: 24px 0 40px; margin-bottom: 32px; }
.buyer-console .buyer-hero-headline { font-size: 44px; }

/* Wishlist heart button overlaid on product cards */
.wish-btn {
  position: absolute; top: 10px; right: 10px; z-index: 2;
  width: 34px; height: 34px; border-radius: 50%; border: none;
  background: rgba(255, 255, 255, 0.92); color: var(--muted);
  font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: transform 0.15s, background 0.15s, color 0.15s;
  font-family: inherit;
}
.wish-btn:hover { transform: scale(1.08); background: #fff; color: var(--rose-deep); }
.wish-btn.active { background: var(--rose-faint); color: var(--rose-deep); }
.wish-btn.active::before { content: '♥'; }
.wish-btn:not(.active)::before { content: '♡'; }

/* Wishlist page empty state */
.wish-empty {
  padding: 60px 20px; text-align: center; color: var(--muted);
  background: var(--panel); border: 1px dashed var(--line); border-radius: 16px;
}
.wish-empty .wish-empty-icon { font-size: 40px; color: var(--rose); margin-bottom: 12px; }
.wish-empty h3 { font-family: 'Fraunces', serif; font-size: 24px; color: var(--ink); margin-bottom: 6px; font-weight: 500; }

/* Team console role badge */
.role-pill {
  display: inline-block; padding: 2px 8px; border-radius: 999px;
  font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600;
}
.role-pill.super { background: var(--rose-faint); color: var(--rose-deep); }
.role-pill.admin { background: var(--gold-light); color: var(--gold); }
.role-pill.user  { background: var(--sage-light); color: var(--sage); }
.role-pill.muted { background: var(--cream); color: var(--muted); }

/* Disabled action button (visible-but-blocked) */
.btn-disabled-perm {
  opacity: 0.45; cursor: not-allowed; pointer-events: none;
}
.perm-hint {
  font-size: 11px; color: var(--muted); font-style: italic; margin-top: 4px;
}

/* Team table */
.team-table {
  width: 100%; border-collapse: collapse; background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  font-size: 13.5px;
}
.team-table th, .team-table td {
  padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--line-soft);
}
.team-table th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; background: var(--cream-light); }
.team-table tr:last-child td { border-bottom: none; }
.team-table .actions-cell { text-align: right; }
.team-table .actions-cell button { margin-left: 6px; }

/* Buyer profile page */
.profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; max-width: 760px; }
.profile-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; }
.profile-card h3 { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 500; margin-bottom: 14px; }
.profile-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line-soft); font-size: 13.5px; }
.profile-row:last-child { border-bottom: none; }
.profile-row .k { color: var(--muted); }
.profile-row .v { color: var(--ink); font-weight: 500; }
@media (max-width: 700px) {
  .profile-grid { grid-template-columns: 1fr; }
  .buyer-console .console-sidebar { width: 200px; }
}
.buyer-hero {
  display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px;
  padding: 48px 0 56px; border-bottom: 1px solid var(--line-soft); margin-bottom: 48px;
}
.buyer-hero-headline {
  font-family: 'Fraunces', serif; font-size: 56px; line-height: 0.98;
  letter-spacing: -0.03em; font-weight: 400; margin-bottom: 24px;
}
.buyer-hero-headline em { font-style: italic; color: var(--rose-deep); font-weight: 500; }
.buyer-hero-sub { font-size: 16px; color: var(--ink-soft); max-width: 440px; margin-bottom: 28px; line-height: 1.5; }
.buyer-hero-visual {
  aspect-ratio: 4/5; border-radius: 20px;
  background: linear-gradient(135deg, #E8C4B5, #C97B63);
  position: relative; overflow: hidden;
}
.buyer-hero-visual::after {
  content: ''; position: absolute; inset: 0;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.15'/></svg>");
  mix-blend-mode: overlay;
}

/* ======== PRODUCT GRID ======== */
.section-head {
  display: flex; justify-content: space-between; align-items: flex-end;
  margin-bottom: 28px;
}
.section-title { font-family: 'Fraunces', serif; font-size: 34px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.1; }
.section-title em { font-style: italic; color: var(--rose-deep); font-weight: 500; }
.section-sub { font-size: 13px; color: var(--muted); margin-top: 6px; }
.filters {
  display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; align-items: center;
}
.filter-chip {
  padding: 8px 14px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 100px; font-size: 12px; color: var(--ink-soft); cursor: pointer;
  font-family: inherit;
}
.filter-chip:hover { border-color: var(--ink-soft); }
.filter-chip.active { background: var(--ink); color: var(--cream-light); border-color: var(--ink); }
.products-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px;
}
.product-card {
  cursor: pointer; transition: transform 0.2s;
  background: transparent; border: none; padding: 0; text-align: left; font-family: inherit; color: inherit;
}
.product-card:hover { transform: translateY(-2px); }
.product-image {
  width: 100%; aspect-ratio: 3/4; border-radius: 14px; margin-bottom: 10px;
  position: relative; overflow: hidden;
}
.product-image::after {
  content: ''; position: absolute; inset: 0;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.12'/></svg>");
  mix-blend-mode: overlay;
}
.match-badge {
  position: absolute; top: 10px; left: 10px;
  background: rgba(250, 246, 239, 0.95); backdrop-filter: blur(8px);
  padding: 5px 10px; border-radius: 100px; font-size: 11px; font-weight: 500;
  color: var(--rose-deep); z-index: 2; display: flex; align-items: center; gap: 4px;
}
.match-badge::before { content: ''; width: 6px; height: 6px; background: var(--rose-deep); border-radius: 50%; }
.product-brand { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 3px; }
.product-name { font-family: 'Fraunces', serif; font-size: 15px; font-weight: 500; color: var(--ink); line-height: 1.2; margin-bottom: 4px; }
.product-price { font-size: 13px; color: var(--ink-soft); font-weight: 500; }

/* ======== PRODUCT DETAIL ======== */
.product-detail {
  display: grid; grid-template-columns: 1fr 1fr; gap: 48px;
  max-width: 1200px; margin: 0 auto; padding: 32px 40px 80px;
}
.detail-image-large {
  aspect-ratio: 4/5; border-radius: 20px; position: relative; overflow: hidden;
}
.detail-image-large::after {
  content: ''; position: absolute; inset: 0;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.85'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.1'/></svg>");
  mix-blend-mode: overlay;
}
.detail-brand { font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em; color: var(--muted); margin-bottom: 10px; }
.detail-name { font-family: 'Fraunces', serif; font-size: 36px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 16px; }
.detail-price { font-family: 'Fraunces', serif; font-size: 24px; font-weight: 500; margin-bottom: 28px; }
.detail-desc { font-size: 14px; color: var(--ink-soft); margin-bottom: 24px; line-height: 1.5; }
.why-section {
  background: var(--rose-faint); border-radius: 16px; padding: 20px 24px; margin-bottom: 28px;
}
.why-label {
  font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--rose-deep); margin-bottom: 12px; font-weight: 500;
}
.why-item { display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-start; }
.why-item:last-child { margin-bottom: 0; }
.why-bullet {
  width: 18px; height: 18px; border-radius: 50%; background: var(--rose-deep);
  color: var(--cream-light); font-size: 10px; display: flex; align-items: center;
  justify-content: center; flex-shrink: 0; margin-top: 2px; font-weight: 600;
}
.why-text { font-size: 14px; line-height: 1.45; color: var(--ink); }
.size-section { margin-bottom: 28px; }
.size-label { font-size: 13px; color: var(--ink-soft); margin-bottom: 10px; font-weight: 500; }
.size-row { display: flex; gap: 8px; flex-wrap: wrap; }
.size-box {
  min-width: 56px; padding: 12px 14px; border: 1px solid var(--line);
  border-radius: 10px; text-align: center; font-size: 13px; cursor: pointer;
  transition: all 0.15s; background: transparent; color: var(--ink-soft); font-family: inherit;
}
.size-box.selected { background: var(--ink); color: var(--cream-light); border-color: var(--ink); }
.size-box.out { opacity: 0.4; cursor: not-allowed; text-decoration: line-through; }

/* ======== SELLER CONSOLE ======== */
.console { display: flex; min-height: 100vh; }
.console-sidebar {
  width: 240px; background: var(--panel); border-right: 1px solid var(--line);
  padding: 24px 0; display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; flex-shrink: 0;
}
.console-brand { padding: 0 24px 24px; border-bottom: 1px solid var(--line-soft); margin-bottom: 16px; }
.console-brand-mark { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 500; letter-spacing: -0.04em; }
.console-brand-mark .dot { color: var(--rose); }
.console-brand-sub { font-size: 11px; color: var(--muted); letter-spacing: 0.16em; text-transform: uppercase; margin-top: 4px; }
.nav-section { padding: 0 12px; margin-bottom: 12px; }
.nav-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); padding: 8px 12px 6px; font-weight: 500; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px;
  border-radius: 8px; font-size: 13.5px; color: var(--ink-soft);
  cursor: pointer; margin-bottom: 2px; transition: all 0.15s;
}
.nav-item:hover { background: var(--cream); color: var(--ink); }
.nav-item.active { background: var(--ink); color: var(--cream-light); font-weight: 500; }
.nav-icon { width: 16px; display: inline-flex; justify-content: center; font-size: 13px; opacity: 0.7; }
.nav-item.active .nav-icon { opacity: 1; }
.nav-badge { margin-left: auto; background: var(--rose); color: white; font-size: 10px; padding: 2px 6px; border-radius: 8px; font-weight: 600; min-width: 18px; text-align: center; }
.nav-item.active .nav-badge { background: var(--rose-light); color: var(--rose-deep); }
.console-footer { margin-top: auto; padding: 16px 20px; border-top: 1px solid var(--line-soft); }
.console-main { flex: 1; padding: 28px 36px 80px; min-width: 0; overflow-x: hidden; }

/* ======== SHARED PAGE ELEMENTS ======== */
.page-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid var(--line-soft);
}
.page-title { font-family: 'Fraunces', serif; font-size: 30px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.1; }
.page-sub { font-size: 13px; color: var(--muted); margin-top: 6px; }
.page-actions { display: flex; gap: 10px; }

.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
.kpi-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
.kpi-card.accent { background: linear-gradient(135deg, var(--rose-faint), var(--panel)); }
.kpi-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.kpi-value { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 500; letter-spacing: -0.02em; line-height: 1; }
.kpi-delta { font-size: 12px; margin-top: 6px; }
.kpi-delta.up { color: var(--ok); }
.kpi-delta.down { color: var(--alert); }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.panel-header { padding: 16px 22px; border-bottom: 1px solid var(--line-soft); display: flex; justify-content: space-between; align-items: center; }
.panel-title { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 500; }
.panel-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

.table { width: 100%; border-collapse: collapse; }
.table thead th {
  text-align: left; padding: 11px 22px; font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted);
  font-weight: 500; border-bottom: 1px solid var(--line-soft); background: var(--cream-light);
}
.table tbody td { padding: 13px 22px; border-bottom: 1px solid var(--line-soft); font-size: 13px; vertical-align: middle; }
.table tbody tr:last-child td { border-bottom: none; }
.table tbody tr:hover { background: var(--cream-light); }
.cell-primary { font-weight: 500; color: var(--ink); }
.cell-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 100px; font-size: 11px; font-weight: 500; }
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
.badge-ok { background: var(--ok-light); color: var(--ok); } .badge-ok::before { background: var(--ok); }
.badge-warn { background: var(--gold-light); color: var(--gold); } .badge-warn::before { background: var(--gold); }
.badge-alert { background: var(--alert-light); color: var(--alert); } .badge-alert::before { background: var(--alert); }
.badge-neutral { background: var(--cream); color: var(--ink-soft); } .badge-neutral::before { background: var(--muted); }
.badge-rose { background: var(--rose-light); color: var(--rose-deep); } .badge-rose::before { background: var(--rose-deep); }

.product-thumb { width: 44px; height: 44px; border-radius: 8px; flex-shrink: 0; }
.product-row { display: flex; align-items: center; gap: 12px; }

.grad-1 { background: linear-gradient(135deg, #C97B63, #8A4A35); }
.grad-2 { background: linear-gradient(135deg, #5A6B7A, #2A3540); }
.grad-3 { background: linear-gradient(135deg, #7A8871, #3A4535); }
.grad-4 { background: linear-gradient(135deg, #B8A388, #5A4535); }
.grad-5 { background: linear-gradient(135deg, #D4B5A0, #8A6E5A); }
.grad-6 { background: linear-gradient(135deg, #3A4550, #1A2025); }
.grad-7 { background: linear-gradient(135deg, #E8C4B5, #C97B63); }
.grad-8 { background: linear-gradient(135deg, #8A6E5A, #4A3525); }
.grad-9 { background: linear-gradient(135deg, #A85A42, #5A2A1F); }
.grad-10 { background: linear-gradient(135deg, #6A7A8A, #3A4A5A); }

.alert-row {
  padding: 12px 16px; background: var(--alert-light); border-radius: 10px; font-size: 13px;
  display: flex; align-items: center; gap: 10px; margin-bottom: 10px; border-left: 3px solid var(--alert);
}
.alert-row.warn { background: var(--gold-light); border-left-color: var(--gold); }
.alert-row.info { background: var(--rose-faint); border-left-color: var(--rose); }
.alert-icon { font-size: 16px; }
.alert-content { flex: 1; }
.alert-title { font-weight: 500; font-size: 13px; }
.alert-sub { font-size: 12px; color: var(--ink-mid); margin-top: 2px; }

.stock-bar { width: 80px; height: 6px; background: var(--line-soft); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.stock-bar-fill { height: 100%; background: var(--ok); border-radius: 3px; transition: width 0.3s; }
.stock-bar-fill.low { background: var(--gold); }
.stock-bar-fill.critical { background: var(--alert); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
.tab {
  padding: 10px 16px; font-size: 13px; color: var(--muted); cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500;
  background: transparent; border-left: none; border-right: none; border-top: none; font-family: inherit;
}
.tab:hover { color: var(--ink-soft); }
.tab.active { color: var(--ink); border-bottom-color: var(--rose); }
.tab-count { margin-left: 6px; background: var(--cream); color: var(--ink-soft); padding: 1px 7px; border-radius: 10px; font-size: 11px; }
.tab.active .tab-count { background: var(--rose-light); color: var(--rose-deep); }

.timeline { position: relative; padding-left: 20px; }
.timeline::before { content: ''; position: absolute; left: 5px; top: 4px; bottom: 4px; width: 1px; background: var(--line); }
.timeline-step { position: relative; padding-bottom: 14px; }
.timeline-step::before {
  content: ''; position: absolute; left: -20px; top: 3px;
  width: 11px; height: 11px; border-radius: 50%; background: var(--line); border: 2px solid var(--panel);
}
.timeline-step.done::before { background: var(--ok); }
.timeline-step.active::before { background: var(--rose); box-shadow: 0 0 0 4px var(--rose-faint); }
.timeline-title { font-size: 13px; font-weight: 500; }
.timeline-time { font-size: 11px; color: var(--muted); margin-top: 2px; }

.filter-bar { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
.search-field {
  flex: 1; min-width: 240px; padding: 8px 12px; border: 1px solid var(--line);
  border-radius: 8px; font-size: 13px; background: var(--panel); outline: none; font-family: inherit;
}
.search-field:focus { border-color: var(--rose); }

.field { margin-bottom: 14px; }
.field-label { display: block; font-size: 12px; color: var(--ink-mid); margin-bottom: 6px; font-weight: 500; }
.field-input {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
  font-family: inherit; font-size: 13px; background: var(--panel); outline: none;
}
.field-input:focus { border-color: var(--rose); }
textarea.field-input { resize: vertical; min-height: 70px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.quantity-control { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; }
.qty-btn { width: 30px; height: 30px; background: transparent; border: none; cursor: pointer; font-size: 16px; color: var(--ink-soft); }
.qty-btn:hover { background: var(--cream); }
.qty-input {
  width: 50px; text-align: center; border: none;
  border-left: 1px solid var(--line); border-right: 1px solid var(--line);
  padding: 6px 0; font-family: inherit; font-size: 13px; outline: none;
}

.empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty-state-icon { font-size: 36px; opacity: 0.3; margin-bottom: 12px; }
.empty-state-text { font-size: 14px; margin-bottom: 16px; }

.color-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
.color-swatch { aspect-ratio: 1; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: all 0.15s; }
.color-swatch:hover { transform: scale(1.05); }
.color-swatch.selected { border-color: var(--ink); transform: scale(1.05); }

.tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
.tag-chip { padding: 4px 10px; background: var(--cream); border-radius: 100px; font-size: 11px; color: var(--ink-soft); }

.filter-pill {
  padding: 7px 12px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; font-size: 12px; color: var(--ink-soft); cursor: pointer; font-family: inherit;
}
.filter-pill:hover { border-color: var(--ink-soft); }
.filter-pill.active { background: var(--ink); color: var(--cream-light); border-color: var(--ink); }

/* ======== MODAL ======== */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(26, 22, 18, 0.5); z-index: 200;
  display: flex; align-items: center; justify-content: center; padding: 20px;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--panel); border-radius: 16px; max-width: 600px; width: 100%;
  max-height: 90vh; overflow-y: auto; animation: slideUp 0.25s ease;
}
.modal.large { max-width: 820px; }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-header { padding: 20px 24px; border-bottom: 1px solid var(--line-soft); display: flex; justify-content: space-between; align-items: center; }
.modal-title { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 500; }
.modal-close { background: transparent; border: none; font-size: 22px; cursor: pointer; color: var(--muted); padding: 4px 8px; border-radius: 6px; }
.modal-close:hover { background: var(--cream); color: var(--ink); }
.modal-body { padding: 24px; }
.modal-footer { padding: 16px 24px; border-top: 1px solid var(--line-soft); display: flex; justify-content: flex-end; gap: 10px; background: var(--cream-light); }

/* ======== TOAST ======== */
.toast-stack { position: fixed; top: 80px; right: 20px; z-index: 300; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--ink); color: var(--cream-light); padding: 12px 18px;
  border-radius: 10px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  animation: slideRight 0.3s ease; min-width: 250px;
  display: flex; align-items: center; gap: 10px;
}
@keyframes slideRight { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.toast.success { background: var(--ok); }
.toast.warn { background: var(--gold); color: white; }
.toast.error { background: var(--alert); color: white; }
.toast.info { background: var(--rose-deep); color: white; }

/* ======== DEMO BANNER ======== */
.demo-banner {
  position: fixed; top: 0; left: 0; right: 0;
  background: var(--ink); color: var(--cream-light); padding: 6px 16px;
  font-size: 11px; text-align: center; z-index: 100; letter-spacing: 0.05em;
  display: flex; align-items: center; justify-content: center; gap: 16px;
}
.demo-banner strong { color: var(--rose-light); }
.demo-banner button {
  background: rgba(255,255,255,0.15); border: none; color: var(--cream-light);
  font-size: 10px; padding: 3px 10px; border-radius: 4px; cursor: pointer; font-family: inherit;
  letter-spacing: 0.04em;
}
.demo-banner button:hover { background: rgba(255,255,255,0.25); }
.app-body { padding-top: 28px; }

/* ======== ONBOARDING (buyer) ======== */
.onboard-wrap {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 40px 24px;
  background: radial-gradient(circle at 20% 10%, rgba(232, 196, 181, 0.3), transparent 40%), var(--bg);
}
.onboard-card {
  max-width: 560px; width: 100%; background: var(--panel); border: 1px solid var(--line);
  border-radius: 24px; padding: 40px 40px 32px;
}
.onboard-step-label {
  font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--rose-deep); margin-bottom: 14px; font-weight: 500;
}
.onboard-question {
  font-family: 'Fraunces', serif; font-size: 32px; font-weight: 500;
  letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 8px;
}
.onboard-question em { font-style: italic; color: var(--rose-deep); }
.onboard-sub { font-size: 14px; color: var(--muted); margin-bottom: 28px; line-height: 1.5; }
.onboard-options { display: grid; gap: 10px; margin-bottom: 28px; }
.onboard-option {
  padding: 16px 20px; background: var(--cream-light); border: 1px solid var(--line);
  border-radius: 14px; cursor: pointer; display: flex; align-items: center; gap: 14px;
  transition: all 0.15s; text-align: left; font-family: inherit;
}
.onboard-option:hover { border-color: var(--rose); }
.onboard-option.selected { border-color: var(--rose); background: var(--rose-faint); }
.onboard-option-visual {
  width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--rose-light), var(--rose));
}
.onboard-option-content { flex: 1; }
.onboard-option-title { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 500; }
.onboard-option-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

.scan-viz {
  margin: 0 auto 24px; width: 200px; height: 250px; position: relative;
  border-radius: 100px 100px 90px 90px; overflow: hidden;
  background: linear-gradient(160deg, var(--rose-light), var(--cream));
  box-shadow: 0 20px 40px rgba(201, 123, 99, 0.25);
}
.scan-face {
  position: absolute; inset: 16px;
  border-radius: 90px 90px 80px 80px;
  background:
    radial-gradient(ellipse at 35% 42%, var(--ink-soft) 2%, transparent 3%),
    radial-gradient(ellipse at 65% 42%, var(--ink-soft) 2%, transparent 3%),
    radial-gradient(ellipse at 50% 58%, var(--ink-soft) 1.5%, transparent 2.5%),
    linear-gradient(180deg, #E6A890, #C97B63);
  opacity: 0.55;
}
.scan-beam {
  position: absolute; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--rose-deep), transparent);
  box-shadow: 0 0 20px var(--rose-deep);
  animation: scan 2.5s ease-in-out infinite;
}
@keyframes scan {
  0% { transform: translateY(-20px); } 100% { transform: translateY(280px); }
}
.scan-results-card {
  background: var(--cream); border-radius: 14px; padding: 18px 20px; margin-bottom: 24px;
}
.scan-results-card .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
.scan-results-card .row:last-child { border-bottom: none; }
.scan-results-card .lbl { font-size: 13px; color: var(--muted); }
.scan-results-card .val { font-family: 'Fraunces', serif; font-size: 15px; font-weight: 500; }

/* ======== CART ======== */
.cart-item {
  display: flex; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--line-soft);
}
.cart-item:last-child { border-bottom: none; }
.cart-item-img { width: 80px; aspect-ratio: 3/4; border-radius: 10px; flex-shrink: 0; }
.cart-item-info { flex: 1; }
.cart-item-brand { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
.cart-item-name { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 500; margin: 4px 0; }
.cart-item-meta { font-size: 12px; color: var(--muted); }
.cart-item-price { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 500; text-align: right; }
.cart-summary {
  background: var(--cream); border-radius: 14px; padding: 20px 22px;
}
.cart-summary-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
.cart-summary-row.total { padding-top: 12px; border-top: 1px solid var(--line); font-family: 'Fraunces', serif; font-size: 18px; font-weight: 500; margin-top: 10px; }

.muted { color: var(--muted); }
.text-sm { font-size: 12px; }
.text-xs { font-size: 11px; }
.flex-between { display: flex; justify-content: space-between; align-items: center; }
.mb-12 { margin-bottom: 12px; }
.mb-16 { margin-bottom: 16px; }
.mb-24 { margin-bottom: 24px; }
.chart-wrap { padding: 20px 24px 30px; height: 200px; display: flex; align-items: flex-end; gap: 8px; }
.chart-bar {
  flex: 1; background: linear-gradient(to top, var(--rose), var(--rose-light));
  border-radius: 4px 4px 0 0; position: relative; min-height: 20px;
}
.chart-bar-label { position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--muted); white-space: nowrap; }
.chart-bar-val { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--ink-mid); font-weight: 500; }

.breadcrumb { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
.breadcrumb a { color: var(--muted); text-decoration: none; cursor: pointer; }
.breadcrumb a:hover { color: var(--ink); }

.vendor-card-admin {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 20px; margin-bottom: 12px;
}
.vendor-card-admin .vc-head { display: flex; justify-content: space-between; margin-bottom: 12px; align-items: flex-start; }
.vendor-card-admin .vc-name { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 500; }
.vendor-card-admin .vc-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
.vendor-card-admin .vc-detail { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 14px; }
.vc-detail-item .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.vc-detail-item .val { font-size: 13px; color: var(--ink); margin-top: 2px; }

/* ============================================================
   ======== HOMEPAGE — NEW LUXURY DESIGN (April 2026) =========
   ============================================================ */

/* Sticky homepage navigation */
.home-nav {
  position: sticky; top: 0; z-index: 60;
  background: rgba(251, 248, 243, 0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line-soft);
}
.home-nav-inner {
  max-width: 1440px; margin: 0 auto;
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 32px;
  padding: 16px 36px;
}
.home-nav-brand { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 500; letter-spacing: -0.04em; color: var(--ink); cursor: pointer; }
.home-nav-brand .dot { color: var(--rose); }
.home-nav-links { display: flex; gap: 28px; align-items: center; justify-self: start; margin-left: 24px; }
.home-nav-link {
  font-size: 13px; color: var(--ink-soft); cursor: pointer; padding: 6px 0;
  border-bottom: 2px solid transparent; transition: all 0.15s; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.08em;
}
.home-nav-link:hover { color: var(--ink); border-bottom-color: var(--ink); }
.home-nav-link.sale { color: var(--sale); }
.home-nav-search {
  display: flex; align-items: center; background: var(--panel); border: 1px solid var(--line);
  border-radius: 100px; padding: 9px 16px; min-width: 280px; max-width: 380px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.home-nav-search:focus-within { border-color: var(--ink-soft); box-shadow: 0 0 0 3px rgba(26, 22, 18, 0.05); }
.home-nav-search input {
  border: none; outline: none; background: transparent; font-family: inherit; font-size: 13px; color: var(--ink);
  flex: 1; min-width: 0;
}
.home-nav-search input::placeholder { color: var(--muted); }
.home-nav-search-icon { color: var(--muted); margin-right: 8px; font-size: 14px; }
.home-nav-icons { display: flex; align-items: center; gap: 14px; }
.home-nav-icon-btn {
  width: 38px; height: 38px; border-radius: 50%;
  background: transparent; border: 1px solid transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-family: inherit; color: var(--ink-soft); position: relative;
  transition: all 0.15s;
}
.home-nav-icon-btn:hover { background: var(--cream); color: var(--ink); }
.home-nav-icon-btn .icon-glyph { font-size: 16px; }
.home-nav-icon-btn .icon-count {
  position: absolute; top: -2px; right: -2px;
  background: var(--rose-deep); color: white; font-size: 10px; font-weight: 600;
  min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px;
  display: flex; align-items: center; justify-content: center;
}
.home-nav-cta {
  padding: 9px 20px; background: var(--ink); color: var(--cream-light);
  border: none; border-radius: 100px; font-size: 12px; font-weight: 500;
  letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; font-family: inherit;
  transition: background 0.15s;
}
.home-nav-cta:hover { background: var(--navy-deep); }

/* Hero section */
.home-hero {
  max-width: 1440px; margin: 0 auto;
  padding: 56px 36px 80px;
  display: grid; grid-template-columns: 1.1fr 1fr; gap: 56px; align-items: center;
}
.home-hero-content { padding-right: 24px; }
.home-hero-tag {
  display: inline-block; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--rose-deep); padding: 4px 12px; border: 1px solid var(--rose-light);
  border-radius: 100px; background: var(--rose-faint); margin-bottom: 24px;
  font-weight: 500;
}
.home-hero-title {
  font-family: 'Fraunces', serif; font-size: 88px; line-height: 0.95;
  letter-spacing: -0.04em; font-weight: 400; color: var(--ink); margin-bottom: 28px;
}
.home-hero-title em { font-style: italic; color: var(--rose-deep); font-weight: 500; }
.home-hero-lead {
  font-size: 17px; line-height: 1.55; color: var(--ink-soft); max-width: 480px; margin-bottom: 36px;
}
.home-hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }
.btn-luxe {
  padding: 14px 28px; background: var(--ink); color: var(--cream-light);
  border: none; border-radius: 100px; font-size: 13px; font-weight: 500;
  letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; font-family: inherit;
  transition: transform 0.15s, background 0.15s;
}
.btn-luxe:hover { background: var(--navy-deep); transform: translateY(-1px); }
.btn-luxe-outline {
  padding: 13px 27px; background: transparent; color: var(--ink);
  border: 1.5px solid var(--ink); border-radius: 100px; font-size: 13px; font-weight: 500;
  letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; font-family: inherit;
  transition: all 0.15s;
}
.btn-luxe-outline:hover { background: var(--ink); color: var(--cream-light); }
.home-hero-trust {
  display: flex; gap: 32px; margin-top: 44px; padding-top: 28px; border-top: 1px solid var(--line-soft);
}
.home-hero-trust-item .num {
  font-family: 'Fraunces', serif; font-size: 28px; font-weight: 500; color: var(--ink);
}
.home-hero-trust-item .lbl {
  font-size: 11px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 4px;
}
.home-hero-visual {
  aspect-ratio: 4/5; border-radius: 24px; overflow: hidden; position: relative;
  background: linear-gradient(135deg, #5A4A3D 0%, #8B6F40 60%, #C97B63 100%);
  box-shadow: 0 40px 80px -25px rgba(26, 22, 18, 0.45);
}
.home-hero-visual img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  z-index: 0; opacity: 0; transition: opacity 0.5s ease;
}
.home-hero-visual img.loaded { opacity: 0.92; }

/* Cinematic overlay gradient */
.home-hero-visual::before {
  content: ''; position: absolute; inset: 0; z-index: 1;
  background:
    linear-gradient(180deg, rgba(0,0,0,0.35) 0%, transparent 25%, transparent 55%, rgba(0,0,0,0.55) 100%),
    linear-gradient(90deg, rgba(0,0,0,0.15) 0%, transparent 50%);
}
/* Film grain */
.home-hero-visual::after {
  content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n'><feTurbulence baseFrequency='0.85'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.20'/></svg>");
  mix-blend-mode: overlay;
}

/* Poster — corner stamps */
.poster-stamp {
  position: absolute; top: 28px; left: 28px; z-index: 3;
  color: white; font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.22em; line-height: 1.5;
  text-transform: uppercase; font-weight: 500;
}
.poster-stamp .stamp-divider {
  width: 28px; height: 1px; background: rgba(255,255,255,0.55); margin: 8px 0;
}
.poster-edition {
  position: absolute; top: 24px; right: 28px; z-index: 3;
  text-align: right; color: white;
}
.poster-edition .pe-label {
  font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
  font-family: 'JetBrains Mono', monospace; opacity: 0.75; margin-bottom: 2px;
}
.poster-edition .pe-num {
  font-family: 'Fraunces', serif; font-size: 64px; font-weight: 400; line-height: 0.9;
  letter-spacing: -0.04em;
}

/* Center serif title — magazine cover */
.poster-title {
  position: absolute; left: 28px; right: 28px; bottom: 38%; z-index: 3;
  color: white;
}
.poster-title .pt-kicker {
  font-size: 11px; letter-spacing: 0.36em; font-weight: 600;
  text-transform: uppercase; opacity: 0.9; margin-bottom: 8px;
}
.poster-title .pt-headline {
  font-family: 'Fraunces', serif; font-size: 84px; line-height: 0.9;
  font-weight: 400; letter-spacing: -0.04em;
}
.poster-title .pt-headline em {
  font-style: italic; font-weight: 500; color: #F3DDD2;
}
.poster-title .pt-sub {
  font-size: 11px; letter-spacing: 0.36em; font-weight: 600;
  text-transform: uppercase; opacity: 0.9; margin-top: 12px;
}

/* Bottom rule + featured pieces strip */
.poster-rule {
  position: absolute; left: 28px; right: 28px; bottom: 132px; z-index: 3;
  height: 1px; background: rgba(255,255,255,0.4);
}
.poster-credits {
  position: absolute; left: 28px; right: 28px; bottom: 96px; z-index: 3;
  display: flex; justify-content: space-between; align-items: center;
  color: white; font-family: 'JetBrains Mono', monospace; font-size: 10px;
  letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.85;
}
.poster-pieces {
  position: absolute; left: 28px; right: 28px; bottom: 28px; z-index: 3;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
  padding-top: 16px;
  border-top: 1px solid rgba(255,255,255,0.25);
}
.poster-piece { color: white; }
.poster-piece .pp-num {
  font-family: 'Fraunces', serif; font-size: 16px; font-weight: 500;
  font-style: italic; opacity: 0.7; margin-bottom: 4px;
}
.poster-piece .pp-name {
  font-size: 11.5px; line-height: 1.3; font-weight: 500;
  margin-bottom: 2px;
}
.poster-piece .pp-price {
  font-family: 'Fraunces', serif; font-size: 13px; opacity: 0.85;
}

/* Decorative bottom-left circle stamp (like a vinyl/wax seal) */
.poster-seal {
  position: absolute; bottom: 168px; right: 32px; z-index: 3;
  width: 76px; height: 76px; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.5);
  display: flex; align-items: center; justify-content: center;
  color: white; text-align: center; line-height: 1.1;
  font-family: 'Fraunces', serif; font-size: 11px; font-weight: 500;
  font-style: italic; padding: 6px;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  background: rgba(0,0,0,0.15);
  transform: rotate(-8deg); cursor: pointer;
  transition: transform 0.3s;
}
.poster-seal:hover { transform: rotate(0deg) scale(1.04); }
.poster-seal .seal-line { display: block; }
.poster-seal .seal-strong { font-size: 14px; font-weight: 600; }

/* Mobile poster scaling */
@media (max-width: 700px) {
  .poster-edition .pe-num { font-size: 44px; }
  .poster-title .pt-headline { font-size: 56px; }
  .poster-pieces { grid-template-columns: repeat(2, 1fr); }
  .poster-pieces .poster-piece:nth-child(3) { display: none; }
  .poster-seal { width: 60px; height: 60px; font-size: 9px; bottom: 200px; right: 24px; }
}

/* Section base styling */
.home-section { max-width: 1440px; margin: 0 auto; padding: 64px 36px; }
.home-section-head {
  display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 36px;
}
.home-section-eyebrow {
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted);
  margin-bottom: 8px; font-weight: 500;
}
.home-section-title {
  font-family: 'Fraunces', serif; font-size: 44px; font-weight: 400;
  letter-spacing: -0.02em; line-height: 1.05; color: var(--ink);
}
.home-section-title em { font-style: italic; color: var(--rose-deep); font-weight: 500; }
.home-section-link {
  font-size: 13px; color: var(--ink); cursor: pointer; padding: 8px 0;
  border-bottom: 1.5px solid var(--ink); font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.08em;
}
.home-section-link:hover { color: var(--rose-deep); border-bottom-color: var(--rose-deep); }

/* Categories — visual tile strip */
.home-categories {
  display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px;
}
.home-cat-tile {
  aspect-ratio: 3/4; border-radius: 18px; overflow: hidden; position: relative;
  cursor: pointer; transition: transform 0.25s; border: none; padding: 0;
  font-family: inherit; color: inherit;
}
.home-cat-tile:hover { transform: translateY(-3px); }
.home-cat-tile-img {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
}
.home-cat-tile-img::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.7) 100%);
}
.home-cat-tile-content {
  position: absolute; bottom: 16px; left: 16px; right: 16px; z-index: 2;
  color: white; text-align: left;
}
.home-cat-tile-content .lbl {
  font-family: 'Fraunces', serif; font-size: 18px; font-weight: 500; letter-spacing: -0.01em;
}
.home-cat-tile-content .sub { font-size: 11px; opacity: 0.85; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }

/* Category gradient backgrounds for tiles */
.cat-grad-1 { background: linear-gradient(135deg, #E8C4B5, #A85A42); }
.cat-grad-2 { background: linear-gradient(135deg, #D4C8B8, #7A6F5A); }
.cat-grad-3 { background: linear-gradient(135deg, #C9D4C4, #5A7A52); }
.cat-grad-4 { background: linear-gradient(135deg, #E0CFC0, #8B6F40); }
.cat-grad-5 { background: linear-gradient(135deg, #C7B5A8, #5A4A3D); }
.cat-grad-6 { background: linear-gradient(135deg, #DDC9BC, #BB8868); }

/* Trending products — refined product card */
.home-products-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px;
}
.home-product {
  cursor: pointer; transition: transform 0.2s;
  background: transparent; border: none; padding: 0; text-align: left; font-family: inherit; color: inherit;
  position: relative;
}
.home-product:hover { transform: translateY(-3px); }
.home-product-img {
  width: 100%; aspect-ratio: 3/4; border-radius: 14px; margin-bottom: 14px;
  position: relative; overflow: hidden;
}
.home-product-img::after {
  content: ''; position: absolute; inset: 0;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.10'/></svg>");
  mix-blend-mode: overlay;
}
.home-product-badges {
  position: absolute; top: 10px; left: 10px; z-index: 2;
  display: flex; flex-direction: column; gap: 6px; align-items: flex-start;
}
.product-badge {
  font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 4px 8px; border-radius: 4px;
}
.product-badge.new { background: var(--ink); color: var(--cream-light); }
.product-badge.sale { background: var(--sale); color: white; }
.product-badge.exclusive { background: var(--gold-deep); color: white; }
.home-product-wish {
  position: absolute; top: 10px; right: 10px; z-index: 2;
  width: 36px; height: 36px; border-radius: 50%; border: none;
  background: rgba(255, 255, 255, 0.95); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: var(--muted);
  transition: all 0.15s; font-family: inherit;
}
.home-product-wish:hover { background: white; color: var(--rose-deep); transform: scale(1.08); }
.home-product-wish.active { background: var(--rose-faint); color: var(--rose-deep); }
.home-product-wish.active::before { content: '♥'; }
.home-product-wish:not(.active)::before { content: '♡'; }
.home-product-brand {
  font-size: 10px; color: var(--muted); letter-spacing: 0.16em; text-transform: uppercase;
  margin-bottom: 4px; font-weight: 500;
}
.home-product-name {
  font-size: 14.5px; color: var(--ink); margin-bottom: 6px; line-height: 1.35;
  font-weight: 500;
}
.home-product-rating { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 12px; }
.home-product-rating .stars { color: var(--gold-deep); letter-spacing: 1px; }
.home-product-rating .count { color: var(--muted); }
.home-product-price-row { display: flex; align-items: baseline; gap: 8px; }
.home-product-price {
  font-family: 'Fraunces', serif; font-size: 17px; font-weight: 500; color: var(--ink);
}
.home-product-price-original {
  font-size: 13px; color: var(--muted); text-decoration: line-through;
}
.home-product-price-discount {
  font-size: 11px; color: var(--sale); font-weight: 600; letter-spacing: 0.04em;
}
.home-product-match {
  position: absolute; bottom: 14px; left: 14px;
  background: rgba(26, 22, 18, 0.85); color: var(--cream-light);
  font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 4px 8px; border-radius: 4px; backdrop-filter: blur(4px);
}

/* Why Styli — 3-step value prop */
.home-why {
  background: linear-gradient(180deg, var(--cream-light) 0%, var(--bg) 100%);
  margin-top: 32px;
}
.home-why-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
.home-why-step {
  background: var(--panel); border: 1px solid var(--line-soft); border-radius: 18px;
  padding: 36px 28px; position: relative;
}
.home-why-step-num {
  font-family: 'Fraunces', serif; font-size: 13px; color: var(--rose-deep);
  letter-spacing: 0.16em; text-transform: uppercase; font-weight: 500; margin-bottom: 16px;
}
.home-why-step-icon {
  width: 48px; height: 48px; border-radius: 12px; background: var(--cream);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; margin-bottom: 20px;
}
.home-why-step h3 {
  font-family: 'Fraunces', serif; font-size: 24px; font-weight: 500;
  letter-spacing: -0.01em; color: var(--ink); margin-bottom: 10px;
}
.home-why-step p {
  font-size: 14px; color: var(--ink-soft); line-height: 1.55;
}

/* Featured brands */
.home-brands { background: var(--panel); border-radius: 24px; padding: 48px 40px; border: 1px solid var(--line-soft); }
.home-brands-grid {
  display: grid; grid-template-columns: repeat(6, 1fr); gap: 24px;
}
.home-brand-card {
  background: var(--cream-light); border: 1px solid var(--line-soft); border-radius: 14px;
  padding: 24px 16px; text-align: center; cursor: pointer; transition: all 0.2s;
}
.home-brand-card:hover { border-color: var(--ink-soft); transform: translateY(-2px); }
.home-brand-logo {
  width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 12px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Fraunces', serif; font-size: 22px; font-weight: 500;
  background: var(--cream); color: var(--ink);
}
.home-brand-name {
  font-size: 13px; font-weight: 500; color: var(--ink); margin-bottom: 4px;
}
.home-brand-meta { font-size: 10px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }

/* Editorial / Look Book */
.home-editorial {
  display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: stretch;
}
.home-editorial-card {
  aspect-ratio: 16/10; border-radius: 20px; overflow: hidden; position: relative;
  cursor: pointer; transition: transform 0.25s;
}
.home-editorial-card:hover { transform: scale(1.01); }
.home-editorial-card.tall { aspect-ratio: 4/5; }
.home-editorial-bg-1 { background: linear-gradient(135deg, #2C3E50, #5A4A3D 60%, #B8935E); }
.home-editorial-bg-2 { background: linear-gradient(135deg, #C97B63, #E8C4B5 80%); }
.home-editorial-content {
  position: absolute; bottom: 28px; left: 28px; right: 28px; color: white; z-index: 2;
}
.home-editorial-card::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.55) 100%);
}
.home-editorial-eyebrow {
  font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.85; margin-bottom: 8px; font-weight: 500;
}
.home-editorial-title {
  font-family: 'Fraunces', serif; font-size: 32px; font-weight: 500; line-height: 1.1; margin-bottom: 8px;
  letter-spacing: -0.01em;
}
.home-editorial-cta { font-size: 13px; opacity: 0.95; }
.home-editorial-cta::after { content: ' →'; }

/* Newsletter */
.home-newsletter {
  background: var(--ink); color: var(--cream-light); border-radius: 24px;
  padding: 64px 48px; text-align: center;
  margin: 32px 0;
}
.home-newsletter-eyebrow {
  font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--rose-light); margin-bottom: 16px; font-weight: 500;
}
.home-newsletter h2 {
  font-family: 'Fraunces', serif; font-size: 44px; font-weight: 400;
  letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 14px;
}
.home-newsletter h2 em { font-style: italic; color: var(--rose-light); font-weight: 500; }
.home-newsletter p {
  font-size: 15px; opacity: 0.7; max-width: 440px; margin: 0 auto 32px; line-height: 1.6;
}
.home-newsletter-form {
  display: flex; max-width: 440px; margin: 0 auto; gap: 8px;
}
.home-newsletter-form input {
  flex: 1; padding: 14px 22px; background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.18); border-radius: 100px;
  color: var(--cream-light); font-family: inherit; font-size: 14px;
  outline: none; transition: border-color 0.15s;
}
.home-newsletter-form input::placeholder { color: rgba(245, 240, 232, 0.45); }
.home-newsletter-form input:focus { border-color: rgba(255,255,255,0.4); }
.home-newsletter-form button {
  padding: 14px 28px; background: var(--cream-light); color: var(--ink);
  border: none; border-radius: 100px; font-size: 13px; font-weight: 500;
  letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; font-family: inherit;
}
.home-newsletter-form button:hover { background: white; }

/* Footer */
.home-footer {
  background: var(--cream-light); border-top: 1px solid var(--line-soft);
  margin-top: 64px;
}
.home-footer-inner {
  max-width: 1440px; margin: 0 auto; padding: 64px 36px 32px;
}
.home-footer-grid {
  display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr; gap: 56px;
  padding-bottom: 48px; border-bottom: 1px solid var(--line-soft);
}
.home-footer-brand {
  font-family: 'Fraunces', serif; font-size: 32px; font-weight: 500;
  letter-spacing: -0.04em; color: var(--ink); margin-bottom: 16px;
}
.home-footer-brand .dot { color: var(--rose); }
.home-footer-tagline {
  font-size: 14px; color: var(--ink-soft); line-height: 1.55; max-width: 320px; margin-bottom: 20px;
}
.home-footer-social { display: flex; gap: 10px; }
.home-footer-social-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--panel); border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; cursor: pointer; color: var(--ink-soft); transition: all 0.15s;
  font-family: inherit;
}
.home-footer-social-btn:hover { background: var(--ink); color: var(--cream-light); border-color: var(--ink); }
.home-footer-col h4 {
  font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--ink); margin-bottom: 16px;
}
.home-footer-col ul { list-style: none; padding: 0; }
.home-footer-col li {
  font-size: 13px; color: var(--ink-soft); margin-bottom: 10px; cursor: pointer;
  transition: color 0.15s;
}
.home-footer-col li:hover { color: var(--ink); }
.home-footer-bottom {
  padding-top: 28px; display: flex; justify-content: space-between; align-items: center;
  font-size: 12px; color: var(--muted);
}
.home-footer-bottom-links { display: flex; gap: 18px; }
.home-footer-bottom-links a {
  color: var(--muted); cursor: pointer; transition: color 0.15s;
}
.home-footer-bottom-links a:hover { color: var(--ink); }

/* Responsive — tablet */
@media (max-width: 1100px) {
  .home-hero { grid-template-columns: 1fr; gap: 32px; padding: 32px 24px 48px; }
  .home-hero-content { padding-right: 0; }
  .home-hero-title { font-size: 64px; }
  .home-section { padding: 48px 24px; }
  .home-section-title { font-size: 32px; }
  .home-categories { grid-template-columns: repeat(3, 1fr); }
  .home-products-grid { grid-template-columns: repeat(2, 1fr); }
  .home-why-grid { grid-template-columns: 1fr; }
  .home-brands-grid { grid-template-columns: repeat(3, 1fr); }
  .home-editorial { grid-template-columns: 1fr; }
  .home-footer-grid { grid-template-columns: 1fr 1fr; gap: 32px; }
  .home-nav-links { display: none; }
  .home-nav-search { min-width: auto; }
  .home-newsletter h2 { font-size: 32px; }
}

@media (max-width: 700px) {
  .home-nav-inner { grid-template-columns: auto auto; padding: 12px 16px; gap: 12px; }
  .home-nav-search { display: none; }
  .home-hero-title { font-size: 44px; }
  .home-categories { grid-template-columns: repeat(2, 1fr); }
  .home-products-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
  .home-brands-grid { grid-template-columns: repeat(2, 1fr); }
  .home-footer-grid { grid-template-columns: 1fr; gap: 28px; }
  .home-newsletter { padding: 40px 24px; }
  .home-newsletter h2 { font-size: 26px; }
  .home-newsletter-form { flex-direction: column; }
}

/* ======== PRODUCT IMAGES (real photos overlaying gradient fallback) ======== */
.product-image img,
.home-product-img img,
.cart-item-img img,
.detail-image-large img,
.product-thumb img {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover;
  z-index: 1;
  opacity: 0; transition: opacity 0.4s ease;
}
.product-image img.loaded,
.home-product-img img.loaded,
.cart-item-img img.loaded,
.detail-image-large img.loaded,
.product-thumb img.loaded { opacity: 1; }
.cart-item-img, .product-thumb { position: relative; overflow: hidden; }
/* Make sure overlays sit above the image */
.home-product-badges, .home-product-wish, .home-product-match,
.match-badge, .wish-btn { z-index: 3 !important; }

/* ======== ANNOUNCEMENT BAR (rotating offers) ======== */
.home-announce {
  background: var(--ink); color: var(--cream-light);
  font-size: 12px; letter-spacing: 0.06em;
  padding: 11px 24px; text-align: center;
  position: relative; overflow: hidden;
}
.home-announce-track {
  display: flex; align-items: center; justify-content: center; gap: 32px;
  animation: announce-scroll 28s linear infinite;
  white-space: nowrap;
}
.home-announce-item { display: inline-flex; align-items: center; gap: 8px; }
.home-announce-item .icon { color: var(--rose-light); font-size: 14px; }
.home-announce-item strong { color: white; font-weight: 600; letter-spacing: 0.08em; }
.home-announce-item .code {

.home-offer-card .of-sub {

.home-offer-1 { background: linear-gradient(135deg, #FBE9E0, #F3DDD2); color: var(--rose-deep); }

.home-collection::after {

  // Sync the live TEAM_PERMISSIONS module-level variable with state on every render.
  // This way the global can() helper always reflects the latest edits from the
  // Permissions editor without rewriting every call site.
  TEAM_PERMISSIONS = state.permissions || DEFAULT_TEAM_PERMISSIONS;

  const addToast = useCallback((message, type='info', icon='✓') => {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, { id, message, type, icon }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3500);
  }, []);

  // Patching helpers — these modify state immutably
  const actions = useMemo(() => ({
    setCurrentUser: (u) => setState(s => ({ ...s, currentUser: u })),
    logout: () => setState(s => ({ ...s, currentUser: null, buyerCart: [], buyerWishlist: [] })),

    // Buyer wishlist
    toggleWishlist: (productId) => setState(s => {
      const list = s.buyerWishlist || [];
      const exists = list.includes(productId);
      return { ...s, buyerWishlist: exists ? list.filter(x => x !== productId) : [...list, productId] };
    }),
    clearWishlist: () => setState(s => ({ ...s, buyerWishlist: [] })),

    // Team console actions (Superadmin only — UI must gate these too)
    addTeamMember: (data) => setState(s => {
      const id = 'tm-' + Math.random().toString(36).slice(2, 8);
      const today = new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
      const newMember = { id, joinedAt: today, ...data };
      return { ...s, teamUsers: [...(s.teamUsers || []), newMember] };
    }),
    removeTeamMember: (id) => setState(s => ({ ...s, teamUsers: (s.teamUsers || []).filter(t => t.id !== id) })),
    updateTeamMemberRole: (id, role) => setState(s => ({
      ...s,
      teamUsers: (s.teamUsers || []).map(t => t.id === id ? { ...t, role } : t),
    })),

    // Permissions editor actions (Superadmin only — UI also gates these)
    togglePermission: (action, role) => setState(s => {
      const perms = deepClonePermissions(s.permissions || DEFAULT_TEAM_PERMISSIONS);
      const current = perms[action] || [];
      const idx = current.indexOf(role);
      if (idx >= 0) current.splice(idx, 1);
      else current.push(role);
      perms[action] = current;
      return { ...s, permissions: perms };
    }),
    resetPermissions: () => setState(s => ({ ...s, permissions: deepClonePermissions(DEFAULT_TEAM_PERMISSIONS) })),

    // Vendor signup
    applyVendor: (data) => setState(s => {
      const id = 'v-' + Math.random().toString(36).slice(2, 8);
      const newV = { id, ...data, status: 'pending', appliedAt: new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) };
      return { ...s, vendors: [...s.vendors, newV] };
    }),

    // Admin actions
    approveVendor: (id) => setState(s => ({
      ...s,
      vendors: s.vendors.map(v => v.id === id ? { ...v, status: 'approved', score: 100 } : v)
    })),
    rejectVendor: (id) => setState(s => ({
      ...s,
      vendors: s.vendors.map(v => v.id === id ? { ...v, status: 'rejected' } : v)
    })),

    // Product CRUD (vendor)
    addProduct: (p) => setState(s => ({ ...s, products: [{ ...p, id: 'p-' + Math.random().toString(36).slice(2, 8), recommended: 0, clicks: 0, approved: true }, ...s.products] })),
    updateProduct: (p) => setState(s => ({ ...s, products: s.products.map(x => x.id === p.id ? p : x) })),
    deleteProduct: (id) => setState(s => ({ ...s, products: s.products.filter(p => p.id !== id) })),
    toggleProductListed: (id) => setState(s => ({ ...s, products: s.products.map(p => p.id === id ? { ...p, listed: !p.listed } : p) })),
    updateStock: (id, stock) => setState(s => ({ ...s, products: s.products.map(p => p.id === id ? { ...p, stock } : p) })),

    // Buyer actions
    signupBuyer: (data) => setState(s => {
      const id = 'b-' + Math.random().toString(36).slice(2, 8);
      const newB = { id, ...data };
      return { ...s, buyers: [...s.buyers, newB], currentUser: { ...newB, role: 'buyer' } };
    }),
    updateBuyerProfile: (profile) => setState(s => ({ ...s, buyerProfile: profile })),
    addToCart: (item) => setState(s => {
      const existing = s.buyerCart.find(x => x.productId === item.productId && x.size === item.size);
      if (existing) {
        return { ...s, buyerCart: s.buyerCart.map(x => x === existing ? { ...x, qty: x.qty + 1 } : x) };
      }
      return { ...s, buyerCart: [...s.buyerCart, item] };
    }),
    removeFromCart: (productId, size) => setState(s => ({ ...s, buyerCart: s.buyerCart.filter(x => !(x.productId === productId && x.size === size)) })),
    updateCartQty: (productId, size, qty) => setState(s => ({ ...s, buyerCart: s.buyerCart.map(x => (x.productId === productId && x.size === size) ? { ...x, qty } : x) })),

    placeOrders: (buyerInfo) => setState(s => {
      const now = new Date().toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit', hour12: true });
      const newOrders = s.buyerCart.map(item => {
        const p = s.products.find(x => x.id === item.productId);
        return {
          id: 'SY-' + Math.floor(Math.random() * 9000 + 1000),
          vendorId: p?.vendorId || '',
          buyerId: s.currentUser?.id || 'buyer-demo',
          productId: item.productId,
          size: item.size, qty: item.qty, price: item.price,
          buyer: buyerInfo.name, city: buyerInfo.city, pin: buyerInfo.pin,
          status: 'to-ship', placed: now, dispatchByHrs: 48,
        };
      });
      // Decrement stock
      const updatedProducts = s.products.map(p => {
        const orderForP = newOrders.filter(o => o.productId === p.id);
        if (orderForP.length === 0) return p;
        const newStock = { ...p.stock };
        orderForP.forEach(o => { newStock[o.size] = Math.max(0, (newStock[o.size] || 0) - o.qty); });
        return { ...p, stock: newStock };
      });
      return {
        ...s,
        orders: [...newOrders, ...s.orders],
        products: updatedProducts,
        buyerCart: [],
        buyerOrders: [...newOrders, ...(s.buyerOrders || [])],
      };
    }),

    // Vendor order actions
    shipOrder: (orderId) => setState(s => ({
      ...s,
      orders: s.orders.map(o => o.id === orderId ? { ...o, status: 'in-transit' } : o)
    })),
    markDelivered: (orderId) => setState(s => ({
      ...s,
      orders: s.orders.map(o => o.id === orderId ? { ...o, status: 'delivered' } : o)
    })),
    cancelOrder: (orderId) => setState(s => ({
      ...s,
      orders: s.orders.map(o => o.id === orderId ? { ...o, status: 'cancelled' } : o)
    })),

    // Returns
    approveReturn: (returnId) => setState(s => {
      const ret = s.returns.find(r => r.id === returnId);
      if (!ret) return s;
      return {
        ...s,
        returns: s.returns.map(r => r.id === returnId ? { ...r, status: 'approved' } : r),
        products: s.products.map(p => p.id === ret.productId ? { ...p, stock: { ...p.stock, [ret.size]: (p.stock[ret.size] || 0) + 1 } } : p),
      };
    }),
    disputeReturn: (returnId) => setState(s => ({
      ...s,
      returns: s.returns.map(r => r.id === returnId ? { ...r, status: 'disputed' } : r)
    })),

    resetAll: () => {
      localStorage.removeItem(STORAGE_KEY);
      setState(defaultState());
    },
  }), []);

  return (
    <AppContext.Provider value={{ state, actions, addToast }}>
      {children}
      <div className="toast-stack">
        {toasts.map(t => (
          <div key={t.id} className={`toast ${t.type}`}>
            <span>{t.icon}</span><span>{t.message}</span>
          </div>
        ))}
      </div>
    </AppContext.Provider>
  );
}

const totalStock = (stockObj) => Object.values(stockObj || {}).reduce((a, b) => a + b, 0);

// ============ PRODUCT IMAGE (real photo with auto-fallback) ============
// Tries product.imageUrl first → falls back to Picsum (guaranteed to load) → falls back to gradient
function ProductImage({ product, className = '' }) {
  const [loaded, setLoaded] = useState(false);
  const [src, setSrc] = useState(product?.imageUrl);
  const [fellback, setFellback] = useState(false);

  if (!product) return <div className={className}></div>;

  const handleError = () => {
    if (!fellback) {
      setFellback(true);
      setLoaded(false);
      setSrc(`https://picsum.photos/seed/styli-${product.id}/600/800`);
    } else {
      setSrc(null); // both failed; gradient shows
    }
  };

  return (
    <div className={`${className} ${product.grad || ''}`}>
      {src && (
        <img
          src={src}
          alt={product.name}
          loading="lazy"
          className={loaded ? 'loaded' : ''}
          onLoad={() => setLoaded(true)}
          onError={handleError}
        />
      )}
    </div>
  );
}

// ============ IMG FALLBACK HELPER for inline <img> tags ============
// Use as: onError={imgFallback('p-001')}
function imgFallback(productId) {
  return (e) => {
    const t = e.currentTarget;
    if (!t.dataset.fellback) {
      t.dataset.fellback = '1';
      t.src = `https://picsum.photos/seed/styli-${productId}/600/800`;
    } else {
      t.style.display = 'none';
    }
  };
}

// ============ RECENTLY VIEWED — small helper module ============
const RECENTLY_VIEWED_KEY = 'styli-recently-viewed';
function recordRecentlyViewed(productId) {
  try {
    const list = JSON.parse(localStorage.getItem(RECENTLY_VIEWED_KEY) || '[]')
      .filter(id => id !== productId);
    list.unshift(productId);
    localStorage.setItem(RECENTLY_VIEWED_KEY, JSON.stringify(list.slice(0, 8)));
  } catch {}
}
function getRecentlyViewed() {
  try { return JSON.parse(localStorage.getItem(RECENTLY_VIEWED_KEY) || '[]'); }
  catch { return []; }
}

function BuyerSignup({ onNav }) {
  const { actions, addToast } = useApp();
  const [name, setName] = useState('');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');

  const submit = () => {
    if (!name.trim() || !email.trim() || !password.trim()) return;
    actions.signupBuyer({ name: name.trim(), email: email.trim(), password });
    addToast('Welcome to Styli!', 'success');
    onNav('buyer-onboard');
  };

  return (
    <div className="auth-wrap">
      <div className="auth-card">
        <div className="auth-brand">styli<span className="dot">.</span></div>
        <span className="auth-back" onClick={() => onNav('landing')}>← Back</span>
        <h2 className="auth-title">Join <em>Styli</em></h2>
        <p className="auth-sub">Create your account. We'll tune what we show you based on your profile.</p>

function VendorApply({ onNav }) {
  const { actions, addToast } = useApp();
  const [form, setForm] = useState({ name: '', email: '', password: '', type: 'small', gst: '', city: '', phone: '' });
  const [submitting, setSubmitting] = useState(false);
  const update = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const valid = form.name && form.email && form.password && form.gst && form.city && form.phone;

  const submit = async () => {
    if (!valid || submitting) return;
    setSubmitting(true);

    // Try the real D1-backed API first (works on Cloudflare Pages with binding)
    let savedToDB = false;
    try {
      const res = await fetch('/api/vendors/apply', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(form),
      });
      if (res.ok) {
        savedToDB = true;
        addToast('Application submitted. Admin will review within 48 hours.', 'success');
        onNav('vendor-applied');
        setSubmitting(false);
        return;
      } else if (res.status === 409) {
        addToast('An application with this email already exists.', 'warn');
        setSubmitting(false);
        return;
      }
    } catch (err) { /* fall through to localStorage */ }

    // Fallback to localStorage (local preview, or D1 binding/table not set up yet)
    if (!savedToDB) {
      actions.applyVendor(form);
      addToast('Application submitted. Admin will review within 48 hours.', 'success');
      onNav('vendor-applied');
      setSubmitting(false);
    }
  };

  return (
    <div className="auth-wrap">
      <div className="auth-card" style={{ maxWidth: 520 }}>
        <div className="auth-brand">styli<span className="dot">.</span></div>
        <span className="auth-back" onClick={() => onNav('vendor-login')}>← Back to login</span>
        <h2 className="auth-title">Apply to sell on <em>Styli</em></h2>
        <p className="auth-sub">Fill out your business details. Admin approves applications within 48 hours.</p>
        <div className="field">
          <label className="auth-label">Business name</label>
          <input className="auth-input" value={form.name} onChange={e => update('name', e.target.value)} placeholder="Kavya Boutique" />
        </div>
        <div className="field-row">
          <div className="field">
            <label className="auth-label">Email</label>
            <input className="auth-input" value={form.email} onChange={e => update('email', e.target.value)} />
          </div>
          <div className="field">
            <label className="auth-label">Password</label>
            <input className="auth-input" type="password" value={form.password} onChange={e => update('password', e.target.value)} />
          </div>
        </div>
        <div className="field-row">
          <div className="field">
            <label className="auth-label">Business type</label>
            <select className="auth-input" value={form.type} onChange={e => update('type', e.target.value)}>
              <option value="small">Small boutique / independent</option>
              <option value="medium">Established brand / retailer</option>
            </select>
          </div>
          <div className="field">
            <label className="auth-label">City</label>
            <input className="auth-input" value={form.city} onChange={e => update('city', e.target.value)} placeholder="Jaipur" />
          </div>
        </div>
        <div className="field-row">
          <div className="field">
            <label className="auth-label">GST number</label>
            <input className="auth-input" value={form.gst} onChange={e => update('gst', e.target.value)} placeholder="07AABCU9603R1ZN" />
          </div>
          <div className="field">
            <label className="auth-label">Phone</label>
            <input className="auth-input" value={form.phone} onChange={e => update('phone', e.target.value)} placeholder="+91" />

        <button className="btn btn-primary auth-btn" disabled={!valid || submitting} onClick={submit}>{submitting ? 'Submitting…' : 'Submit application →'}</button>

    actions.updateBuyerProfile(profile);
